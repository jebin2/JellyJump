<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.youtube.com; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https: http:; media-src 'self' blob: data: https: http:; connect-src * blob: data:; worker-src 'self' blob:; font-src 'self' data:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JellyJump - Player</title>
    <meta name="description"
        content="JellyJump - A modern, feature-rich video player and editor. Play local files, stream HLS, trim, convert, and create GIFs - all in your browser with complete privacy.">
    <link rel="icon" href="assets/icons/jelly_jump_logo.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jellyjump.voidall.com/player.html">
    <meta property="og:title" content="JellyJump - Player">
    <meta property="og:description"
        content="JellyJump - A modern, feature-rich video player and editor. Play local files, stream HLS, trim, convert, and create GIFs - all in your browser with complete privacy.">
    <meta property="og:image" content="https://jellyjump.voidall.com/assets/icons/jelly_jump_logo.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://jellyjump.voidall.com/player.html">
    <meta property="twitter:title" content="JellyJump - Player">
    <meta property="twitter:description"
        content="JellyJump - A modern, feature-rich video player and editor. Play local files, stream HLS, trim, convert, and create GIFs - all in your browser with complete privacy.">
    <meta property="twitter:image" content="https://jellyjump.voidall.com/assets/icons/jelly_jump_logo.png">

    <!-- Preload animated logo for loading indicator -->
    <link rel="preload" href="assets/icons/jelly_jump_logo.gif" as="image">
    <!-- Preload play button (WebP for smaller size) -->
    <link rel="preload" href="assets/icons/jelly_play.webp" as="image">

    <!-- PWA Support -->
    <meta name="theme-color" content="#00d9a5">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/jelly_jump_logo.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="JellyJump">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/theme.css">
    <!-- Common CSS -->
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/player.css">
    <link rel="stylesheet" href="assets/css/screenshot.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="stylesheet" href="assets/css/player_page.css">
    <link rel="stylesheet" href="assets/css/pull-to-refresh.css">
    <script src="/js/analytics-embed.js" data-project="JellyJump" data-skip-referrer="/JellyJump"></script>
</head>

<body>
    <!-- Page Loading Overlay -->
    <div class="page-loader" id="page-loader">
        <div class="page-loader-logo"></div>
    </div>

    <!-- SVG Icon Sprite (loaded first for immediate use) -->
    <div style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Icons are defined in sprite.svg and loaded via <use> tags -->
            </defs>
        </svg>
    </div>

    <div class="player-layout">
        <!-- Video Section -->
        <main class="video-section" id="player-container">
            <!-- Core Player will be injected here -->
        </main>

        <!-- Playlist Section -->
        <aside class="playlist-section hidden">
            <header class="playlist-header" style="display: none;">
                <!-- Header is now generated by Playlist.js -->
            </header>
            <div class="playlist-content">
                <div class="playlist-placeholder">
                    <!-- Content will be rendered by Playlist.js when ready -->
                </div>
            </div>
        </aside>

        <!-- Mobile Expand Button (separate from playlist) -->
        <button id="mobile-expand-btn" class="mobile-expand-button" aria-label="Expand playlist" title="Expand playlist"
            style="display: none;">
            ▲
        </button>
    </div>

    <!-- Hidden File Inputs -->
    <input type="file" id="mb-file-input" multiple
        accept=".mp4,.webm,.mov,.avi,.mkv,.mp3,.wav,.aac,.m4a,.flac,.ogg,.opus,.vtt,.srt" style="display: none;">
    <input type="file" id="mb-folder-input" webkitdirectory directory style="display: none;">

    <!-- Hidden Download Anchor (reusable) -->
    <a id="mb-download-link" style="display: none;"></a>

    <!-- Scripts -->
    <script type="module" src="assets/js/player-main.js"></script>

</body>

</html>
