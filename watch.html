<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src *; object-src 'none'; base-uri 'self'; form-action 'none'">
    <title>Watch together — JellyJump</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
               background: #0b0b0d; color: #e8e8ea; padding: 16px;
               font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { width: 100%; max-width: 900px; }
        h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 .25rem; }
        p { margin: .25rem 0 0; color: #a0a0a8; }
        .panel { border: 1px solid #26262b; border-radius: 10px; padding: 1.25rem; background: #131317; }
        #stage { margin-top: .75rem; position: relative; }
        #full { position: absolute; right: .6rem; bottom: .6rem;
                display: grid; place-items: center; width: 2.4rem; height: 2.4rem;
                padding: 0; border-radius: 8px; border: 1px solid #ffffff26;
                background: #00000073; color: #fff; cursor: pointer;
                opacity: 0; transition: opacity .15s; }
        /* Shown on hover, and always on touch, where there is no hover to rely on. */
        /* Only once there is a picture: `.live` guards both, so even if the
           button were left in the document it could not surface early. */
        #stage.live:hover #full, #stage.live #full:focus-visible { opacity: 1; }
        @media (hover: none) { #stage.live #full { opacity: 1; } }
        #full:hover { background: #000000a6; }
        /* `display: grid` above is an id selector and beats the browser's own
           [hidden] { display: none }, so the attribute alone left the button in
           the layout and in the tab order with nothing to do. */
        #full[hidden] { display: none; }
        /* In fullscreen the stage is the whole screen, so the video should fill
           it rather than keep a 16:9 box in the middle of black. */
        #stage:fullscreen { margin: 0; display: grid; place-items: center; background: #000; }
        #stage:fullscreen video { height: 100%; width: 100%; aspect-ratio: auto;
                                  object-fit: contain; border-radius: 0; }
        video { width: 100%; background: #000; border-radius: 10px; display: block; }
        /* Collapsed rather than hidden until a frame has arrived. */
        #stage:not(.live) video { height: 1px; opacity: 0; }
        #stage.live video { aspect-ratio: 16 / 9; }
        .row { display: flex; gap: .5rem; margin-top: .75rem; }
        input { flex: 1; min-width: 0; font-family: ui-monospace, monospace; font-size: .8rem;
                padding: .6rem .7rem; border-radius: 8px; border: 1px solid #2e2e35;
                background: #0e0e11; color: #e8e8ea; }
        button { padding: .6rem 1rem; border-radius: 8px; border: 1px solid #2e2e35;
                 background: #1d1d22; color: #e8e8ea; cursor: pointer; font-size: .9rem; }
        button:hover { background: #26262d; }
        .spin { width: 1rem; height: 1rem; border: 2px solid #33333a; border-top-color: #9a9aa4;
                border-radius: 50%; display: inline-block; vertical-align: -2px;
                animation: spin .8s linear infinite; margin-right: .5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    </style>
</head>
<body>
<main>
    <section id="joining" class="panel">
        <h1><span class="spin"></span>Joining…</h1>
        <p>Reading the invitation.</p>
    </section>

    <section id="reply" class="panel" hidden>
        <h1>Send this code back</h1>
        <p>The host needs this to finish connecting. Paste it wherever they sent you the link.</p>
        <div class="row">
            <input id="code" readonly spellcheck="false">
            <button id="copy" type="button">Copy</button>
        </div>
    </section>

    <section id="problem" class="panel" hidden>
        <h1>Can't watch this</h1>
        <p id="detail"></p>
    </section>

    <!-- Always in the document and never display:none. A hidden video element
         can stop decoding, so a stream attached to one may never report
         metadata -- which would leave this page waiting for an event that
         cannot arrive. It is sized to nothing until there is something to
         show instead. -->
    <section id="stage">
        <video id="video" playsinline></video>
        <!-- Fullscreen is not playback control: it changes nothing about what
             the host is sending or where it is, so a viewer gets it. Pause and
             seek are what they do not get, and this adds neither. -->
        <button id="full" type="button" hidden
                aria-label="Fullscreen" title="Fullscreen (or double-click)">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                <path id="full-icon" fill="none" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round"
                      d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3m13 5h3a2 2 0 0 0 2-2v-3"/>
            </svg>
        </button>
    </section>
</main>
<script type="module" src="./assets/js/watch-main.js"></script>
</body>
</html>
