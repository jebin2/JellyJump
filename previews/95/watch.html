<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- font-src is for the theme's local Space Grotesk/Space Mono files; the
         page still talks to nobody but itself and the peer. -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob: mediastream:; connect-src *; object-src 'none'; base-uri 'self'; form-action 'none'">
    <title>Watch together — JellyJump</title>
    <meta name="description" content="Watch what a friend is playing in JellyJump, peer to peer.">

    <!-- Same marks as the rest of the app: this link arrives in a chat from
         someone the viewer trusts, so the page has to be recognisably ours
         before it has connected to anything. -->
    <link rel="icon" href="./assets/jelly_jump_logo-qiMeMAa9.png">
    <link rel="apple-touch-icon" href="./assets/jelly_jump_logo-qiMeMAa9.png">
    <meta name="theme-color" content="#00d9a5">
    <link rel="preload" href="./assets/jelly_jump_logo-jF-iEcbg.gif" as="image">

    <!-- The real theme, not a copy of it: one set of tokens, fonts and the
         loading logo, so this page cannot drift away from the player's look. -->
    <style>body{min-height:100dvh;padding:var(--space-md);background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-primary);font-size:var(--text-base);place-items:center;line-height:1.5;display:grid}main{width:100%;max-width:900px}.brand{margin-bottom:var(--space-md);justify-content:center;display:flex}.brand .nav-logo-img{height:32px}h1{font-size:var(--text-lg);font-weight:var(--font-bold);margin:0 0 var(--space-xs)}p{margin:var(--space-xs) 0 0;color:var(--text-secondary)}.panel{border:1px solid var(--border-dark);padding:var(--space-lg);background:var(--bg-secondary);border-radius:8px;box-shadow:0 10px 25px #00000080}.interrupted{color:var(--text-primary);font-size:var(--text-xs);pointer-events:none;background:#000000b8;border-radius:6px;margin:0;padding:.3rem .6rem;position:absolute;top:.6rem;left:.6rem}#interrupted[hidden],#stage:not(.live) .interrupted{display:none}.waiting{margin:var(--space-md) 0 0;font-size:var(--text-sm);color:var(--accent-warning);line-height:1.5}#waiting[hidden]{display:none}.route{font-size:var(--text-xs);color:var(--text-muted);margin:.75rem 0 0;line-height:1.5}#route[hidden],#flow[hidden]{display:none}#stage{margin-top:.75rem;position:relative}#full{width:2.4rem;height:2.4rem;color:var(--text-primary);cursor:pointer;opacity:0;transition:opacity var(--transition-normal), color var(--transition-normal);background:#00000073;border:1px solid #ffffff26;border-radius:8px;place-items:center;padding:0;display:grid;position:absolute;bottom:.6rem;right:.6rem}#full:hover{color:var(--accent-primary);background:#000000a6}#full svg{fill:currentColor}#stage.live:hover #full{opacity:1}#stage.live #full:focus-visible{opacity:1}@media (hover:none){#stage.live #full{opacity:1}}#full[hidden]{display:none}video{background:#000;border-radius:8px;width:100%;display:block}#stage:not(.live) video{opacity:0;height:1px}#stage.live video{aspect-ratio:16/9}body.watching{padding:0}body.watching main{max-width:none;height:100dvh}body.watching .brand{display:none}body.watching #stage{background:#000;height:100%;margin:0}body.watching #stage.live video{aspect-ratio:auto;object-fit:contain;border-radius:var(--radius-none);width:100%;height:100%}body.watching .readout{opacity:0;transition:opacity var(--transition-normal);pointer-events:none;background:#000000a8;padding:.4rem .8rem;position:fixed;bottom:0;left:0;right:0}body.watching .route{margin:0}body.watching:hover .readout{opacity:1}@media (hover:none){body.watching .readout{opacity:1}}#stage:-webkit-full-screen{background:#000;place-items:center;margin:0;display:grid}#stage:fullscreen{background:#000;place-items:center;margin:0;display:grid}#stage:-webkit-full-screen video{aspect-ratio:auto;object-fit:contain;border-radius:var(--radius-none);width:100%;height:100%}#stage:fullscreen video{aspect-ratio:auto;object-fit:contain;border-radius:var(--radius-none);width:100%;height:100%}.row{gap:var(--space-sm);margin-top:.75rem;display:flex}input{min-width:0;font-family:var(--font-mono);font-size:var(--text-xs);border:1px solid var(--border-dark);background:var(--bg-primary);color:var(--text-primary);border-radius:4px;flex:1;padding:.6rem .7rem}input:focus-visible{border-color:var(--accent-primary);outline:none}button{background-color:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border-dark);font-family:var(--font-primary);font-size:var(--text-sm);cursor:pointer;transition:all var(--transition-normal);border-radius:4px;padding:8px 16px}button:hover{background-color:var(--bg-secondary);color:var(--accent-primary);border-color:var(--accent-primary)}#page-loader{gap:var(--space-md);padding:var(--space-md);flex-direction:column}.page-loader-note{text-align:center;font-size:var(--text-sm);color:var(--text-secondary);margin:0}</style>
  <script type="module" crossorigin src="./assets/watch-DJxfOMKI.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/Logger-BBAIqbWY.js">
  <link rel="modulepreload" crossorigin href="./assets/ErrorReporter-AodrlbkS.js">
  <link rel="modulepreload" crossorigin href="./assets/WatchParty-DlvqbKQb.js">
  <link rel="stylesheet" crossorigin href="./assets/ErrorReporter-D47Dymdg.css">
</head>
<body>
<!-- The same loading screen the player opens with, so the first paint of a
     pasted link is already recognisable -- and it stays up for the whole of
     joining rather than flashing past, because until the code is ready there
     is nothing for anyone to do. The line underneath is what separates it from
     a page that has hung. watch-main.js takes it down the moment there is
     something to show, including on the paths that end in an error. -->
<div class="page-loader" id="page-loader">
    <div class="page-loader-logo"></div>
    <p class="page-loader-note" id="loader-note">Reading the invitation…</p>
</div>
<main>
    <p class="brand">
        <span class="nav-logo">
            <img src="./assets/jelly_jump_logo-qiMeMAa9.png" alt="" class="nav-logo-img">
            JellyJump
        </span>
    </p>

    <section id="reply" class="panel" hidden>
        <h1>Send this code back</h1>
        <p>The host needs this to finish connecting. Paste it wherever they sent you the link.</p>
        <div class="row">
            <input id="code" readonly spellcheck="false">
            <button id="copy" type="button">Copy</button>
        </div>
        <!-- Shown only if the connection gives up while this code is still
             waiting to be pasted, which is not a failure of anything: nothing
             can connect until the host has it. -->
        <p id="waiting" class="waiting" hidden></p>
    </section>

    <section id="problem" class="panel" hidden>
        <h1>Can't watch this</h1>
        <p id="detail"></p>
    </section>

    <div class="readout">
        <!-- Why it is or is not working, in words, for the person who can do
             something about it. A party that will not connect is almost always the
             shape of somebody's home network, and without this neither end can
             tell that from a bug. Candidate types only -- this line is meant to be
             pasted back to the host, and an address would be someone's IP. -->
        <p id="route" class="route" hidden></p>
        <!-- How much is actually arriving. A picture can be soft because the
             encoder has not finished climbing or because the network is the
             ceiling, and those look identical without the numbers. -->
        <p id="flow" class="route" hidden></p>
    </div>

    <!-- Always in the document and never display:none. A hidden video element
         can stop decoding, so a stream attached to one may never report
         metadata -- which would leave this page waiting for an event that
         cannot arrive. It is sized to nothing until there is something to
         show instead. -->
    <section id="stage">
        <video id="video" playsinline></video>
        <!-- A connection can drop briefly and come back on its own. The last
             frame stays put and this says what is happening, rather than the
             page declaring the party over and collapsing the picture. -->
        <p id="interrupted" class="interrupted" hidden>Reconnecting…</p>
        <!-- Fullscreen is not playback control: it changes nothing about what
             the host is sending or where it is, so a viewer gets it. Pause and
             seek are what they do not get, and this adds neither. -->
        <button id="full" type="button" hidden
                aria-label="Fullscreen" title="Fullscreen (or double-click)">
            <!-- The player's own fullscreen icon, from the shared sprite. -->
            <svg width="22" height="22" aria-hidden="true" focusable="false">
                <use id="full-icon" href="./assets/sprite-DJq0wWlQ.svg#icon-fullscreen"></use>
            </svg>
        </button>
    </section>
</main>
</body>
</html>
