<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JellyJump - Player</title><script>(function(){var p=window.location.pathname;var b=p.substring(0,p.lastIndexOf("/")+1);var t=document.createElement("base");t.href=b;document.head.appendChild(t);})();</script>
    <meta name="description"
        content="JellyJump - A modern, feature-rich video player and editor. Play local files, stream HLS, trim, convert, and create GIFs - all in your browser with complete privacy.">
    <link rel="icon" href="assets/icons/jelly_jump_logo.png">

    <!-- Preload animated logo for loading indicator -->
    <link rel="preload" href="assets/icons/jelly_jump_logo.gif" as="image">
    <!-- Preload play button (WebP for smaller size) -->
    <link rel="preload" href="assets/icons/jelly_play.webp" as="image">

    <!-- PWA Support -->
    <meta name="theme-color" content="#00d9a5">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/jelly_jump_logo.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JellyJump">
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('[PWA] Service Worker registered'))
                    .catch(err => console.log('[PWA] Service Worker failed', err));
            });
        }
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/player.bundle.css">
    <!-- Common CSS -->
</head>

<body>
    <!-- Page Loading Overlay -->
    <div class="page-loader" id="page-loader">
        <div class="page-loader-logo"></div>
    </div>

    <!-- SVG Icon Sprite (loaded first for immediate use) -->
    <div style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Icons are defined in sprite.svg and loaded via <use> tags -->
            </defs>
        </svg>
    </div>

    <div class="player-layout">
        <!-- Video Section -->
        <main class="video-section" id="player-container">
            <!-- Core Player will be injected here -->
        </main>

        <!-- Playlist Section -->
        <aside class="playlist-section hidden">
            <header class="playlist-header" style="display: none;">
                <!-- Header is now generated by Playlist.js -->
            </header>
            <div class="playlist-content">
                <div class="playlist-placeholder">
                    <!-- Content will be rendered by Playlist.js when ready -->
                </div>
            </div>
        </aside>

        <!-- Mobile Expand Button (separate from playlist) -->
        <button id="mobile-expand-btn" class="mobile-expand-button" aria-label="Expand playlist" title="Expand playlist"
            style="display: none;">
            ▲
        </button>
    </div>

    <!-- Hidden File Inputs -->
    <input type="file" id="mb-file-input" multiple accept="video/*,audio/*" style="display: none;">
    <input type="file" id="mb-folder-input" webkitdirectory directory style="display: none;">

    <!-- Hidden Download Anchor (reusable) -->
    <a id="mb-download-link" style="display: none;"></a>

    <!-- Import Map: Redirect CDN imports to local files -->
        <script type="importmap">
    {
        "imports": {
            "/npm/mediabunny@1.27.4/+esm": "./assets/js/lib/mediabunny.js",
            "../../../../assets/js/lib/mediabunny.js": "./assets/js/lib/mediabunny.js",
            "../../../../assets/js/lib/mediabunny-mp3-encoder.js": "./assets/js/lib/mediabunny-mp3-encoder.js",
            "../../../../assets/js/lib/hls.js": "./assets/js/lib/hls.js",
            "../../../../assets/js/lib/gif.js": "./assets/js/lib/gif.js"
        }
    }
    </script>


    <!-- GIF Encoder Library (local copy for Electron compatibility)-->
    <script type="module" src="assets/js/lib/gif.js"></script>

    <!-- Scripts -->
    <script type="module">
        // Load templates first, then initialize player
        async function initializeApp() {
            // Load playlist templates
            const playlistResponse = await fetch('assets/templates/playlist-templates.html');
            const playlistHtml = await playlistResponse.text();

            // Load screenshot templates
            const screenshotResponse = await fetch('assets/templates/screenshot-templates.html');
            const screenshotHtml = await screenshotResponse.text();

            // Load player templates
            const playerResponse = await fetch('assets/templates/player-templates.html');
            const playerHtml = await playerResponse.text();

            const tempDiv = document.createElement('div');
            tempDiv.style.display = 'none'; // Hide template container
            tempDiv.innerHTML = playlistHtml + screenshotHtml + playerHtml;
            document.body.appendChild(tempDiv);

            // Now that templates are loaded, import and initialize
            const { CorePlayer, Playlist } = await import('./assets/js/bundles/player.bundle.js');

            // Initialize Player (attach to window for cleanup on unload)
            const player = window.player = new CorePlayer('player-container', {
                autoplay: false,
                muted: false,
                mode: 'player'
            });

            // Initialize Playlist (which will initialize SidebarToggle internally)
            const playlist = new Playlist(
                document.querySelector('.playlist-content'),
                player
            );

            // Demo Videos (optional)
            if (!localStorage.getItem('JellyJumpDB-playlist') && (window.location.href.includes('//localhost:') || window.location.href.includes('//jebin2.github.io/JellyJump/') || window.location.href.includes('//www.voidall.com/JellyJump/'))) {
                playlist.addItems([
                    {
                        title: 'ForBiggerBlazes',
                        url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
                        isLocal: false
                    }, {
                        title: 'Kalimba',
                        url: 'https://www.learningcontainer.com/wp-content/uploads/2020/02/Kalimba.mp3',
                        isLocal: false,
                        isAudio: true
                    }, {
                        url: "https://30a-tv.com/feeds/720p/63.m3u8",
                        title: "30A Ridiculous IP TV",
                        isStream: true
                    }
                ], true); // true = autoplay on page load
            }
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }

        // Hide page loader after initialization
        window.addEventListener('load', function () {
            const loader = document.getElementById('page-loader');
            if (loader) {
                loader.classList.add('hidden');
            }
        });

        // CRITICAL: Cleanup on page unload to prevent memory accumulation
        // pagehide is more reliable than unload/beforeunload
        window.addEventListener('beforeunload', function () {
            console.log('[Player] beforeunload - destroying player');
            // Destroy player if it exists (closes MediaBunny resources, audio context, etc.)
            if (window.player && typeof window.player.destroy === 'function') {
                window.player.destroy();
                window.player = null;
            }
        });

        // Also keep unload to disable bfcache (back-forward cache)
        window.addEventListener('unload', function () { });
    </script>

</body>

</html>
