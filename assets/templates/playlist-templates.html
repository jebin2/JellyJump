<!-- Playlist Templates -->
<!-- All HTML templates for the playlist component -->
<!-- These are cloned and populated with data in Playlist.js -->

<!-- Playlist Item Template -->
<template id="playlist-item-template">
    <div class="playlist-item" data-index="" tabindex="0" role="button">
        <div class="playlist-thumbnail"></div>
        <div class="playlist-info">
            <div class="playlist-title"></div>
            <div class="playlist-duration"></div>
        </div>
        <div class="playlist-actions">
            <button class="playlist-download-btn" title="Download video" aria-label="Download">
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-download"></use>
                </svg>
            </button>
            <button class="playlist-remove-btn" title="Remove" aria-label="Remove">
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-trash"></use>
                </svg>
            </button>
            <button class="playlist-settings-btn" title="Video Options" aria-label="Video options menu">
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-more-vertical"></use>
                </svg>
            </button>
        </div>
    </div>
</template>

<!-- Playlist Settings Menu Template -->
<template id="playlist-settings-menu-template">
    <div class="playlist-context-menu" role="menu">
        <div class="playlist-menu-item" data-action="convert" role="menuitem">
            <span class="menu-icon">🔄</span>
            <span class="menu-label">Convert Format...</span>
        </div>
        <div class="playlist-menu-item" data-action="download-manage" role="menuitem">
            <span class="menu-icon">🎬</span>
            <span class="menu-label">Download/Manage Tracks...</span>
        </div>
        <!-- <div class="menu-divider"></div> -->
        <div class="playlist-menu-item" data-action="trim" role="menuitem">
            <span class="menu-icon">✂️</span>
            <span class="menu-label">Cut Video...</span>
        </div>
        <div class="playlist-menu-item" data-action="resize" role="menuitem">
            <span class="menu-icon">📐</span>
            <span class="menu-label">Resize Video...</span>
        </div>
        <div class="playlist-menu-item" data-action="crop" role="menuitem">
            <span class="menu-icon">🖼️</span>
            <span class="menu-label">Crop Video...</span>
        </div>
        <div class="playlist-menu-item" data-action="create-gif" role="menuitem">
            <span class="menu-icon">🎞️</span>
            <span class="menu-label">Create GIF...</span>
        </div>
        <div class="playlist-menu-item" data-action="reverse" role="menuitem">
            <span class="menu-icon">⏪</span>
            <span class="menu-label">Speed / Reverse...</span>
        </div>
        <div class="playlist-menu-item" data-action="remove-bg" role="menuitem">
            <span class="menu-icon">🎨</span>
            <span class="menu-label">Remove Background...</span>
        </div>
        <div class="playlist-menu-item" data-action="watermark" role="menuitem">
            <span class="menu-icon">💧</span>
            <span class="menu-label">Add Watermark...</span>
        </div>
        <!-- <div class="menu-divider"></div> -->
        <div class="playlist-menu-item" data-action="info" role="menuitem">
            <div class="menu-icon">
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-info"></use>
                </svg>
            </div>
            <span class="menu-label">Video Info</span>
        </div>
        <div class="playlist-menu-item" data-action="record" role="menuitem">
            <span class="menu-icon">🔴</span>
            <span class="menu-label">Record Stream...</span>
        </div>
        <div class="playlist-menu-item" data-action="merge" role="menuitem">
            <span class="menu-icon">🔗</span>
            <span class="menu-label">Merge Videos...</span>
        </div>
        <div class="playlist-menu-item" data-action="detect-cuts" role="menuitem">
            <span class="menu-icon">✂️</span>
            <span class="menu-label">Scene Detection...</span>
        </div>
        <div class="playlist-menu-item" data-action="detect-motion" role="menuitem">
            <span class="menu-icon">🏃</span>
            <span class="menu-label">Motion Detection...</span>
        </div>
    </div>
</template>

<!-- Modal Shell Template -->
<template id="modal-shell-template">
    <div class="mb-modal-overlay">
        <div class="mb-modal" role="dialog" aria-modal="true">
            <div class="mb-modal-header">
                <h3 class="mb-modal-title"></h3>
                <button class="mb-modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="mb-modal-body mb-modal-body-scrollable"></div>
            <div class="mb-modal-footer hidden"></div>
        </div>
    </div>
</template>

<!-- Conversion Modal Template -->
<template id="conversion-modal-template">
    <div class="mb-modal-overlay">
        <div class="mb-modal conversion-modal" role="dialog" aria-labelledby="conversion-modal-title" aria-modal="true">
            <div class="mb-modal-header">
                <h3 id="conversion-modal-title" class="mb-modal-title">Convert & Optimize Video</h3>
                <button class="mb-modal-close" aria-label="Close modal">&times;</button>
            </div>

            <div class="mb-modal-body mb-modal-body-scrollable">
                <div class="source-info mb-md">
                    <span class="text-secondary text-sm font-mono">SOURCE:</span>
                    <div class="source-filename text-base font-bold truncate" title=""></div>
                </div>

                <!-- Format Selection -->
                <div class="format-selection mb-lg">
                    <div class="text-secondary text-sm font-mono mb-sm">SELECT FORMAT:</div>
                    <div class="radio-group format-group" role="radiogroup">
                        <!-- Keep Original -->
                        <label class="radio-option">
                            <input type="radio" name="format" value="keep" checked>
                            <span class="radio-custom"></span>
                            <div class="radio-label">
                                <span class="format-name">Original</span>
                                <span class="format-desc">Keep Format</span>
                            </div>
                        </label>

                        <!-- Supported Formats -->
                        <label class="radio-option">
                            <input type="radio" name="format" value="mp4">
                            <span class="radio-custom"></span>
                            <div class="radio-label">
                                <span class="format-name">MP4</span>
                                <span class="format-desc">H.264 / AAC</span>
                            </div>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="format" value="webm">
                            <span class="radio-custom"></span>
                            <div class="radio-label">
                                <span class="format-name">WebM</span>
                                <span class="format-desc">VP9 / Opus</span>
                            </div>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="format" value="mov">
                            <span class="radio-custom"></span>
                            <div class="radio-label">
                                <span class="format-name">MOV</span>
                                <span class="format-desc">QuickTime</span>
                            </div>
                        </label>

                        <!-- Disabled Formats -->
                        <label class="radio-option disabled" title="Coming Soon">
                            <input type="radio" name="format" value="avi" disabled>
                            <span class="radio-custom"></span>
                            <div class="radio-label">
                                <span class="format-name">AVI</span>
                                <span class="format-desc">Legacy</span>
                            </div>
                        </label>
                        <label class="radio-option disabled" title="Coming Soon">
                            <input type="radio" name="format" value="mkv" disabled>
                            <span class="radio-custom"></span>
                            <div class="radio-label">
                                <span class="format-name">MKV</span>
                                <span class="format-desc">Matroska</span>
                            </div>
                        </label>
                        <label class="radio-option disabled" title="Coming Soon">
                            <input type="radio" name="format" value="flv" disabled>
                            <span class="radio-custom"></span>
                            <div class="radio-label">
                                <span class="format-name">FLV</span>
                                <span class="format-desc">Flash</span>
                            </div>
                        </label>
                        <label class="radio-option disabled" title="Coming Soon">
                            <input type="radio" name="format" value="wmv" disabled>
                            <span class="radio-custom"></span>
                            <div class="radio-label">
                                <span class="format-name">WMV</span>
                                <span class="format-desc">Windows</span>
                            </div>
                        </label>
                        <label class="radio-option disabled" title="Coming Soon">
                            <input type="radio" name="format" value="mpeg" disabled>
                            <span class="radio-custom"></span>
                            <div class="radio-label">
                                <span class="format-name">MPEG</span>
                                <span class="format-desc">Classic</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Quality Slider (Always Visible) -->
                <div class="quality-section mb-lg">
                    <div class="flex-between mb-sm">
                        <span class="text-secondary text-sm font-mono">QUALITY:</span>
                        <span class="quality-value text-sm font-bold">Original (100%)</span>
                    </div>
                    <input type="range" class="quality-slider" min="40" max="100" step="20" value="100">
                    <div class="flex-between mt-xs text-xs text-secondary">
                        <span>Low</span>
                        <span>Medium</span>
                        <span>High</span>
                        <span>Original</span>
                    </div>
                    <div class="estimated-reduction text-xs text-accent mt-sm">No size reduction</div>
                </div>

                <div class="options-group mb-lg">
                    <label class="checkbox-option">
                        <input type="checkbox" name="addToPlaylist" checked>
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-label">Add to playlist after conversion</span>
                    </label>
                </div>

                <!-- Progress Section (Hidden by default) -->
                <div class="progress-section hidden">
                    <div class="flex-between mb-xs">
                        <span class="progress-status text-sm font-mono">Processing...</span>
                        <span class="progress-percentage text-sm font-bold">0%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Error Message (Hidden by default) -->
                <div class="error-message hidden mt-md p-sm border-danger text-danger text-sm"></div>

                <!-- Success Message (Hidden by default) -->
                <div class="success-message hidden mt-md p-sm border-success text-success text-sm">
                    Operation complete!
                </div>
            </div>

            <div class="mb-modal-footer">
                <div class="action-buttons flex gap-sm">
                    <a href="#" class="btn jellyjump-btn-small hidden download-btn" title="Download"
                        aria-label="Download" download>
                        <svg width="16" height="16" fill="currentColor">
                            <use href="assets/icons/sprite.svg#icon-download"></use>
                        </svg>
                    </a>
                    <button class="btn jellyjump-btn-small convert-btn" title="Convert" aria-label="Convert">
                        <svg width="16" height="16" fill="currentColor">
                            <use href="assets/icons/sprite.svg#icon-convert"></use>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- Trim Content Template -->
<template id="trim-content-template">
    <!-- Loading State -->
    <div class="trim-loading flex flex-col items-center justify-center p-xl text-muted">
        <div class="spinner-md border-4 border-current border-t-transparent rounded-full w-8 h-8 animate-spin mb-sm">
        </div>
        <span>Loading video info...</span>
    </div>

    <div class="trim-content hidden">
        <!-- Player Container -->
        <div id="trim-player-container" class="mb-lg aspect-video bg-black rounded overflow-hidden relative h300pximpl">
        </div>

        <!-- Visual Timeline Slider -->
        <div class="timeline-slider-container select-none">
            <div class="timeline-slider relative h-12 bg-tertiary rounded cursor-pointer">
                <!-- Track Background -->
                <div class="timeline-track absolute inset-0 rounded overflow-hidden">
                    <!-- Ticks generated by JS -->
                </div>
                <!-- Selected Range -->
                <div
                    class="timeline-range absolute top-0 bottom-0 bg-primary opacity-30 pointer-events-none timeline-range-initial">
                </div>
                <!-- Handles -->
                <div class="timeline-handle start-handle absolute top-0 bottom-0 w-4 bg-accent cursor-ew-resize z-10 -ml-2 rounded-full border-2 border-white shadow-md timeline-handle-start"
                    tabindex="0" role="slider" aria-label="Start time"></div>
                <div class="timeline-handle end-handle absolute top-0 bottom-0 w-4 bg-accent cursor-ew-resize z-10 -ml-2 rounded-full border-2 border-white shadow-md timeline-handle-end"
                    tabindex="0" role="slider" aria-label="End time"></div>
            </div>

            <!-- Time Labels -->
            <div class="flex-between mt-sm text-xs font-mono items-center px-xs">
                <div class="flex flex-col items-start">
                    <span class="text-secondary text-[10px] mb-[2px]">START</span>
                    <span class="trim-start-time text-primary font-bold">00:00:00</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-secondary text-[10px] mb-[2px]">DURATION</span>
                    <span class="trim-duration text-accent font-bold">00:00:00</span>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-secondary text-[10px] mb-[2px]">END</span>
                    <span class="trim-end-time text-primary font-bold">00:00:00</span>
                </div>
            </div>
        </div>
    </div>
</template>

                <span class="font-mono shrink-0 text-right" style="width: 70px;">Sim</span>
                <input type="range" class="quality-slider similarity-slider flex-1" min="0" max="100" value="40"
                    onclick="event.stopPropagation()">
                <span class="similarity-value font-mono w-8 text-right text-primary">0.40</span>
            </div>
            <div class="flex items-center gap-sm text-xs text-secondary">
                <span class="font-mono shrink-0 text-right" style="width: 70px;">Smooth</span>
                <input type="range" class="quality-slider smoothness-slider flex-1" min="0" max="100" value="8"
                    onclick="event.stopPropagation()">
                <span class="smoothness-value font-mono w-8 text-right text-primary">0.08</span>
            </div>
            <div class="flex items-center gap-sm text-xs text-secondary">
                <span class="font-mono shrink-0 text-right" style="width: 70px;">Spill</span>
                <input type="range" class="quality-slider spill-slider flex-1" min="0" max="100" value="10"
                    onclick="event.stopPropagation()">
                <span class="spill-value font-mono w-8 text-right text-primary">0.10</span>
            </div>
        </div>
    </div>

<!-- Watermark Content Template -->
<template id="watermark-content-template">
    <!-- Preview Area -->
    <div class="crop-preview-container mb-lg">
        <div class="crop-preview-wrapper">
            <!-- Reuse crop-player-container class for consistent sizing -->
            <div id="watermark-player-container" class="crop-player-container"></div>

            <!-- Interactive Overlay -->
            <div class="crop-overlay watermark-overlay">
                <!-- Use crop-box class exactly like CropMenu -->
                <div class="crop-box" data-watermark-box>
                    <div class="crop-handle crop-handle-nw" data-handle="nw"></div>
                    <div class="crop-handle crop-handle-n" data-handle="n"></div>
                    <div class="crop-handle crop-handle-ne" data-handle="ne"></div>
                    <div class="crop-handle crop-handle-e" data-handle="e"></div>
                    <div class="crop-handle crop-handle-se" data-handle="se"></div>
                    <div class="crop-handle crop-handle-s" data-handle="s"></div>
                    <div class="crop-handle crop-handle-sw" data-handle="sw"></div>
                    <div class="crop-handle crop-handle-w" data-handle="w"></div>

                    <!-- Content Preview -->
                    <div class="watermark-content-preview w-full h-full flex items-center justify-center overflow-hidden"
                        style="font-family: sans-serif; font-weight: bold; color: rgba(255,255,255,0.8); text-shadow: 1px 1px 2px black;">
                        <span class="text-content">JellyJump</span>
                        <img class="image-content hidden w-full h-full object-contain" src="" alt="">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="watermark-controls">
        <!-- Top Row: Type and Content -->
        <div class="flex gap-md items-end mb-md">
            <!-- Type Selection -->
            <div class="watermark-type-selection flex-shrink-0">
                <div class="text-secondary text-sm font-mono mb-xs">TYPE</div>
                <label class="toggle-switch">
                    <span class="toggle-label label-left active-text">TEXT</span>
                    <input type="checkbox" id="wm-type-toggle">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label label-right">IMAGE</span>
                </label>
            </div>

            <!-- Text Input (Flex Grow) -->
            <div class="wm-text-input-group flex-1">
                <label class="text-xs text-secondary font-mono mb-xs block">TEXT CONTENT</label>
                <input type="text" id="wm-text-content" class="mb-input w-full" placeholder="Enter watermark text"
                    value="JellyJump">
            </div>

            <!-- Image Input (Hidden by default, Flex Grow) -->
            <div class="wm-image-input-group flex-1 hidden">
                <label class="text-xs text-secondary font-mono mb-xs block">IMAGE SOURCE</label>
                <input type="file" id="wm-image-file" class="mb-input w-full mb-input-file-choose"
                    accept="image/png,image/jpeg,image/webp">
            </div>
        </div>

        <!-- Opacity -->
        <div class="wm-opacity-group mb-md">
            <div class="flex-between mb-sm">
                <span class="text-secondary text-sm font-mono">OPACITY:</span>
                <span class="wm-opacity-value text-sm font-bold">100%</span>
            </div>
            <input type="range" id="wm-opacity" class="quality-slider" min="10" max="100" value="100">
        </div>
    </div>
</template>
