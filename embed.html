<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="%JJ_CSP%">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JellyJump - Embed</title>
    <link rel="icon" href="assets/icons/jelly_jump_logo.png">

    <!-- CSS (reuse existing) -->
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/player.css">
    <link rel="stylesheet" href="assets/css/screenshot.css">

    <style>
        /* Embed-specific overrides */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .embed-container {
            width: 100%;
            height: 100%;
        }

        /* Hide elements not needed in embed */
        .jellyjump-help-overlay {
            display: none !important;
        }

        /* controls=none or mute: no control bar at all */
        .embed-no-bar .jellyjump-controls {
            display: none !important;
        }
        /* controls=mute: the only control, over the picture */
        .embed-mute-btn {
            position: fixed;
            right: 14px;
            bottom: 14px;
            z-index: 50;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid var(--accent-primary, #00ff88);
            background: rgba(10, 10, 10, 0.75);
            color: #fff;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }
        .embed-mute-btn:hover,
        .embed-mute-btn:focus-visible {
            background: rgba(10, 10, 10, 0.95);
        }
        /* Error state */
        .embed-error {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #fff;
            font-family: system-ui, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .embed-error h2 {
            margin: 0 0 10px;
            font-size: 1.2rem;
        }

        .embed-error p {
            margin: 0;
            opacity: 0.7;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="embed-container" id="player-container">
        <!-- CorePlayer will be injected here -->
    </div>

    <!-- Hidden Download Anchor (for screenshot) -->
    <a id="mb-download-link" style="display: none;"></a>

    <script type="module" src="assets/js/embed-main.js"></script>

</body>

</html>
