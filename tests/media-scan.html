<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Media Scan Test</title>
    <style>body { font-family: monospace; background: #111; color: #ddd; padding: 16px; } pre { white-space: pre-wrap; }</style>
</head>
<body>
<h3>Media scanner</h3>
<pre id="log">starting…</pre>
<script type="module">
    /**
     * Exercises the scanner end to end on desktop: renderer → IPC → the scanner
     * utilityProcess → streamed batches back. Asserts the things that are easy
     * to get wrong and invisible when they are — that results actually stream
     * rather than arriving in one lump at the end, that the main thread stays
     * responsive while a real tree is walked, and that discovered files stay out
     * of the saved playlist.
     *
     * Set ?root=/some/dir to scan a specific folder instead of the platform's
     * media folders — the runner uses this so the result does not depend on
     * whatever happens to be in the developer's home directory.
     *
     * Dev-only page. In the browser the scanner needs a user gesture and a
     * directory pick, so this page reports that and stops.
     *
     * Console output contract:
     *   "SCAN: <line>"        per-check result
     *   "SCAN-RESULT: ..."    PASS | FAIL
     */
    import { DiscoveredMedia } from '/assets/js/shared/services/DiscoveredMedia.js';
    import { PlaylistStorage } from '/assets/js/ui/player/PlaylistStorage.js';
    import { StorageService } from '/assets/js/shared/services/StorageService.js';

    const logEl = document.getElementById('log');
    const log = (m) => { logEl.textContent += '\n' + m; console.log('SCAN:', m); };
    logEl.textContent = '';

    let pass = 0, fail = 0;
    const check = (ok, label) => {
        if (ok) { pass++; log(`  PASS  ${label}`); }
        else { fail++; log(`  FAIL  ${label}`); }
    };

    try {
        const isElectron = !!window.electronAPI?.isElectron;
        log(`runtime: ${isElectron ? 'Electron desktop' : 'browser'}`);

        if (!isElectron) {
            log('browser scanner needs a user gesture and a picked directory — nothing to assert headlessly');
            check(DiscoveredMedia.isSupported() === (typeof window.showDirectoryPicker === 'function'),
                'browser support reported honestly');
            log('');
            log(`${pass} passed, ${fail} failed`);
            console.log(`SCAN-RESULT: ${fail === 0 ? 'PASS' : 'FAIL'} (${pass} passed, ${fail} failed)`);
        } else {
            const root = new URLSearchParams(location.search).get('root');
            log(root ? `scanning: ${root}` : 'scanning: platform media folders');
            log('');

            check(DiscoveredMedia.isSupported(), 'scanner is available on desktop');

            const discovered = new DiscoveredMedia();
            const batches = [];
            discovered.subscribe((event) => {
                if (event.type === 'batch') batches.push(event.added);
            });

            // A scan that blocks the main thread would be a scan running in the
            // wrong process, which is the whole reason for the utilityProcess.
            let ticks = 0;
            const started = performance.now();
            const timer = setInterval(() => ticks++, 20);

            const done = await new Promise((resolve, reject) => {
                const timeout = setTimeout(() => reject(new Error('scan did not finish within 120s')), 120_000);
                const off = discovered.subscribe((event) => {
                    if (event.type === 'done') { clearTimeout(timeout); off(); resolve(event.summary); }
                    if (event.type === 'error') { clearTimeout(timeout); off(); reject(event.error); }
                });
                discovered.scan(root ? { roots: [root] } : {});
            });

            clearInterval(timer);
            const elapsed = performance.now() - started;
            const blockedRatio = Math.max(0, 1 - (ticks * 20) / elapsed);

            log(`  found ${done.found} video(s) in ${done.scanned} file(s), ${done.elapsedMs}ms`);
            log(`  batches received: ${batches.length}`);
            log(`  main thread blocked: ${(blockedRatio * 100).toFixed(0)}% of the time`);

            check(done.found > 0, `scan found videos (${done.found})`);
            check(discovered.size === done.found, `store holds every result (${discovered.size} of ${done.found})`);
            check(batches.length > 0, 'results arrived in batches while scanning');
            // A ratio over a scan this short is mostly sampling noise: a single
            // missed 20ms tick inside a 50ms window reads as 40% blocked. Only
            // assert once the window is long enough to mean something; a small
            // fixture proves correctness, and the process boundary is what
            // actually guarantees responsiveness.
            if (elapsed >= 1000) {
                check(blockedRatio < 0.1, `main thread blocked under 10% (was ${(blockedRatio * 100).toFixed(0)}%)`);
            } else {
                log(`  (scan too short at ${elapsed.toFixed(0)}ms to measure blocking meaningfully — not asserted)`);
            }

            const items = discovered.items;
            const shaped = items.every(i => i.path && i.name && typeof i.size === 'number' && typeof i.mtime === 'number');
            check(shaped, 'every record has path, name, size and mtime');
            check(items.every(i => i.size > 0), 'no zero-byte results');
            check(new Set(items.map(i => i.path)).size === items.length, 'no duplicate paths');

            // Re-scanning the same roots must converge, not accumulate.
            const sizeAfterFirst = discovered.size;
            await new Promise((resolve, reject) => {
                const timeout = setTimeout(() => reject(new Error('rescan did not finish')), 120_000);
                const off = discovered.subscribe((event) => {
                    if (event.type === 'done') { clearTimeout(timeout); off(); resolve(); }
                });
                discovered.scan(root ? { roots: [root] } : {});
            });
            check(discovered.size === sizeAfterFirst, `rescan is idempotent (${discovered.size} vs ${sizeAfterFirst})`);

            // The point of keeping this separate.
            const saved = await PlaylistStorage.loadPlaylist();
            const savedPaths = new Set((saved?.items ?? saved ?? []).map(i => i?.localPath).filter(Boolean));
            const leaked = items.filter(i => savedPaths.has(i.path));
            check(leaked.length === 0, `discovered files stayed out of the saved playlist (${leaked.length} leaked)`);
            log('');

            // Discovered files are ordinary playlist items grouped under a
            // folder, so they must render through the normal tree and still be
            // excluded when the playlist is persisted.
            log('playlist integration');
            const { PlaylistRenderer } = await import('/assets/js/ui/player/PlaylistRenderer.js');

            const curated = { id: 'curated-1', title: 'Kept.mp4', path: 'Kept.mp4', localPath: '/tmp/Kept.mp4' };
            const asItems = items.map((f, n) => ({
                id: `d-${n}`,
                title: f.name,
                path: `Discovered/${f.name}`,
                localPath: f.path,
                isDiscovered: true,
            }));
            const mixed = [curated, ...asItems];

            const tree = new PlaylistRenderer({ state: {}, expandedFolders: new Set() }).buildTree(mixed);
            const discoveredFolder = tree.children?.['Discovered'];
            check(!!discoveredFolder, 'a "Discovered" folder appears in the playlist tree');
            check(discoveredFolder?.items.length === asItems.length,
                `folder holds every discovered file (${discoveredFolder?.items.length ?? 0} of ${asItems.length})`);
            check(tree.items.some(i => i.id === 'curated-1'),
                'curated items stay at the top level, outside the folder');

            // The filter that keeps jellyjump.json small.
            let written = null;
            const realSave = StorageService.prototype.savePlaylist;
            StorageService.prototype.savePlaylist = function (list) { written = list; };
            try {
                PlaylistStorage.savePlaylist(mixed, 0, 0);
            } finally {
                StorageService.prototype.savePlaylist = realSave;
            }
            check(written?.length === 1 && written[0].id === 'curated-1',
                `only the curated item is persisted (${written?.length ?? 0} of ${mixed.length})`);
            log('');

            // Keeping a discovered file has to change both things: the flag, or
            // it still will not persist, and the path, or it stays filed under a
            // folder that means "not kept".
            log('keeping a discovered file');
            const { Playlist } = await import('/assets/js/ui/player/Playlist.js');
            const target = asItems[0];
            const fake = {
                state: {
                    items: [curated, ...asItems.map(i => ({ ...i }))],
                    findIndex: null,
                },
                _saveState() { this.saved = true; },
                render() { this.rendered = true; },
                _updatePlayerNavigationState() {},
            };
            Playlist.prototype.keepDiscoveredItem.call(fake, target.id);

            const kept = fake.state.items.find(i => i.id === target.id);
            check(kept && !kept.isDiscovered, 'the isDiscovered flag is cleared');
            check(kept && !String(kept.path).startsWith('Discovered/'),
                `it leaves the Discovered folder (path is "${kept?.path}")`);
            check(fake.saved === true, 'the playlist is saved after keeping');

            const afterKeep = [curated, ...fake.state.items.filter(i => i.id !== 'curated-1')];
            let written2 = null;
            StorageService.prototype.savePlaylist = function (list) { written2 = list; };
            try {
                PlaylistStorage.savePlaylist(afterKeep, 0, 0);
            } finally {
                StorageService.prototype.savePlaylist = realSave;
            }
            check(written2?.some(i => i.id === target.id), 'the kept file now persists');
            check(written2?.length === 2, `and only it (${written2?.length ?? 0} persisted)`);

            // A rescan must not resurrect it as a discovered duplicate.
            const knownPaths = new Set(fake.state.items.map(i => i.localPath).filter(Boolean));
            check(knownPaths.has(target.localPath), 'a rescan will skip it as already present');
            log('');

            // Every folder level indents, so an uncapped filesystem path pushes
            // rows off the right edge where they cannot be reached.
            log('deep paths stay navigable');
            const deep = '/home/u/Videos/a/b/c/d/e/f/g/h/i/j/clip.mp4';
            const mapped = Playlist.prototype._discoveredPath.call({}, deep);
            const depth = mapped.split('/').length - 1; // folders above the file
            log(`  ${deep}`);
            log(`  -> ${mapped}`);
            check(depth <= 5, `nesting is capped (${depth} folder levels)`);
            check(mapped.endsWith('clip.mp4'), 'the filename survives capping');
            check(mapped.startsWith('Discovered/Videos/'),
                'the origin folder is kept, so grouping still means something');

            // Two deep files can now map to the same display path; they must
            // still both exist, since identity comes from localPath.
            const other = Playlist.prototype._discoveredPath.call({}, '/home/u/Videos/a/b/c/d/x/other.mp4');
            const collided = [
                { id: 'x1', path: mapped, localPath: deep, isDiscovered: true },
                { id: 'x2', path: other, localPath: '/home/u/Videos/a/b/c/d/x/other.mp4', isDiscovered: true },
            ];
            const collidedTree = new PlaylistRenderer({ state: {}, expandedFolders: new Set() }).buildTree(collided);
            const flatten = (node) => (node.items?.length ?? 0)
                + Object.values(node.children ?? {}).reduce((n, c) => n + flatten(c), 0);
            check(flatten(collidedTree) === 2, 'files sharing a capped path both survive');
            log('');

            // The header is the only place a running scan is visible, so each
            // state has to render distinguishably.
            log('scan status on the folder header');
            const renderStatus = (scanState) => {
                const renderer = new PlaylistRenderer({
                    discoveredFolderName: 'Discovered',
                    scanState,
                    cancelMediaScan() {},
                });
                const header = document.createElement('div');
                const nameEl = document.createElement('div');
                const removeBtn = document.createElement('button');
                header.appendChild(nameEl);
                header.appendChild(removeBtn);
                renderer.decorateScanStatus({ path: 'Discovered' }, header, nameEl, removeBtn);
                return {
                    text: nameEl.querySelector('.folder-scan-status')?.textContent ?? '',
                    cancels: header.querySelectorAll('.folder-scan-cancel-btn').length,
                    failed: !!nameEl.querySelector('.folder-scan-status.failed'),
                };
            };

            const running = renderStatus({ scanning: true, found: 12, phase: 1 });
            check(running.text.includes('media folders'), `pass 1 names itself ("${running.text}")`);
            check(running.cancels === 1, 'a running scan can be cancelled');

            const homePass = renderStatus({ scanning: true, found: 600, phase: 2 });
            check(homePass.text.includes('home'), `pass 2 names itself ("${homePass.text}")`);

            const finished = renderStatus({ scanning: false, found: 12, failed: false });
            check(finished.text === '', 'a finished scan adds no label — the count says it');
            check(finished.cancels === 0, 'and offers no cancel');

            const stopped = renderStatus({ scanning: false, found: 5, cancelled: true });
            check(stopped.text === 'stopped', `a cancelled scan is marked ("${stopped.text}")`);

            const broken = renderStatus({ scanning: false, found: 0, failed: true });
            check(broken.failed && broken.text === 'scan failed', `a failed scan is marked ("${broken.text}")`);

            log('');
            log(`${pass} passed, ${fail} failed`);
            console.log(`SCAN-RESULT: ${fail === 0 ? 'PASS' : 'FAIL'} (${pass} passed, ${fail} failed)`);
        }
    } catch (e) {
        console.error(e);
        log('ERROR: ' + (e?.message || e));
        console.log('SCAN-RESULT: FAIL (threw)');
    }
</script>
</body>
</html>
