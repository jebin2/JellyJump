<!-- Core Player Templates -->

<!-- Modal Shell Template (used by all Modal instances across player and embed) -->
<template id="modal-shell-template">
    <div class="mb-modal-overlay">
        <div class="mb-modal" role="dialog" aria-modal="true">
            <div class="mb-modal-header">
                <h3 class="mb-modal-title"></h3>
                <button class="mb-modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="mb-modal-body mb-modal-body-scrollable"></div>
            <div class="mb-modal-footer hidden"></div>
        </div>
    </div>
</template>

<!-- Video Canvas Template -->
<template id="player-canvas-template">
    <div class="jellyjump-video-wrapper">
        <canvas class="jellyjump-video"></canvas>
        <div class="jellyjump-play-overlay" style="display: none;">
            <div class="play-icon"></div>
        </div>
        <div class="jellyjump-bezel-overlay" style="display: none;">
            <div class="bezel-icon"></div>
            <div class="bezel-text"></div>
        </div>
    </div>
</template>

<!-- Loader Template -->
<template id="player-loader-template">
    <div class="jellyjump-loader"></div>
</template>

<!-- Controls Template -->
<template id="player-controls-template">
    <div class="jellyjump-controls">
        <div class="jellyjump-progress-container control--hidden" role="slider" aria-label="Seek" aria-valuemin="0"
            aria-valuemax="100" aria-valuenow="0" tabindex="0" data-control="progress">
            <div class="jellyjump-progress-bar"></div>
            <div class="jellyjump-loop-region" style="display: none;"></div>
            <div class="jellyjump-marker marker-a" style="display: none;"></div>
            <div class="jellyjump-marker marker-b" style="display: none;"></div>
        </div>
        <div class="jellyjump-controls-row">
            <div style="display: flex; align-items: center;">
                <button class="jellyjump-btn control--hidden" id="mb-play-btn" aria-label="Play" aria-pressed="false"
                    data-control="playPause">
                    <svg width="24" height="24" fill="currentColor">
                        <use href="assets/icons/sprite.svg#icon-play"></use>
                    </svg>
                </button>
                <button class="jellyjump-btn control--hidden" id="mb-prev-btn" aria-label="Previous Video" disabled
                    data-control="navigation">
                    <svg width="24" height="24" fill="currentColor">
                        <use href="assets/icons/sprite.svg#icon-chevron-left"></use>
                    </svg>
                </button>
                <button class="jellyjump-btn control--hidden" id="mb-next-btn" aria-label="Next Video" disabled
                    data-control="navigation">
                    <svg width="24" height="24" fill="currentColor">
                        <use href="assets/icons/sprite.svg#icon-chevron-right"></use>
                    </svg>
                </button>
                <div class="jellyjump-time control--hidden" id="mb-time-display" data-control="time">0:00 / 0:00</div>
            </div>

            <div class="jellyjump-controls-right">

                <!-- Audio Track Menu -->
                <div class="jellyjump-menu-btn" id="mb-audio-container" style="display: none;">
                    <button class="jellyjump-btn" id="mb-audio-btn" aria-label="Audio Tracks" aria-haspopup="true"
                        aria-expanded="false">
                        <svg width="24" height="24" fill="currentColor">
                            <use href="assets/icons/sprite.svg#icon-audio"></use>
                        </svg>
                    </button>
                    <div class="jellyjump-menu" id="mb-audio-menu" role="menu"></div>
                </div>

                <!-- Subtitle Button -->
                <button class="jellyjump-btn control--hidden" id="mb-cc-btn" aria-label="Subtitles"
                    data-control="captions" title="Subtitles">
                    <svg width="24" height="24" fill="currentColor">
                        <use href="assets/icons/sprite.svg#icon-cc"></use>
                    </svg>
                </button>

                <!-- Speed Button -->
                <button class="jellyjump-btn control--hidden" id="mb-speed-btn" aria-label="Playback Speed"
                    data-control="speed" title="Playback Speed"
                    style="font-size: 0.8rem; font-weight: bold; width: auto; padding: 0 8px;">
                    1x
                </button>

                <button class="jellyjump-btn control--hidden" id="mb-filters-btn" aria-label="Video Filters"
                    data-control="filters" title="Video Filters">
                    <svg width="24" height="24" fill="currentColor">
                        <use href="assets/icons/sprite.svg#icon-filter"></use>
                    </svg>
                </button>

                <button class="jellyjump-btn control--hidden" id="mb-audio-settings-btn" aria-label="Audio Settings"
                    data-control="equalizer" title="Audio Settings">
                    <svg width="24" height="24" fill="currentColor">
                        <use href="assets/icons/sprite.svg#icon-volume-high"></use>
                    </svg>
                </button>

                <button class="jellyjump-btn control--hidden" id="mb-loop-btn" aria-label="Loop Mode: Off"
                    data-control="loop" title="Right Click">
                    <svg width="24" height="24" fill="currentColor">
                        <use href="assets/icons/sprite.svg#icon-loop"></use>
                    </svg>
                </button>

                <button class="jellyjump-btn control--hidden" id="mb-fullscreen-btn" aria-label="Fullscreen"
                    data-control="fullscreen">
                    <svg width="24" height="24" fill="currentColor">
                        <use href="assets/icons/sprite.svg#icon-fullscreen"></use>
                    </svg>
                </button>

                <button class="jellyjump-btn mode-toggle-btn control--hidden" id="mb-mode-toggle-btn"
                    aria-label="Pin controls" aria-pressed="false" title="Pin controls" data-control="modeToggle">
                    <span class="icon-unpinned">▼</span>
                    <span class="icon-pinned">▲</span>
                </button>
            </div>
        </div>
    </div>
</template>

<!-- Loop Panel Template -->
<template id="player-loop-panel-template">
    <div class="jellyjump-panel jellyjump-loop-panel" style="display: none;">
        <div class="jellyjump-panel-header">
            <span>Loop</span>
            <button class="jellyjump-close-btn" aria-label="Close">×</button>
        </div>
        <div class="jellyjump-panel-content">
            <div class="loop-mode-options">
                <label class="loop-radio-option">
                    <input type="radio" name="loop-mode" value="off" checked>
                    <span class="radio-label">Off</span>
                </label>
                <label class="loop-radio-option">
                    <input type="radio" name="loop-mode" value="one">
                    <span class="radio-label">Current Video</span>
                </label>
                <label class="loop-radio-option">
                    <input type="radio" name="loop-mode" value="playlist">
                    <span class="radio-label">Playlist</span>
                </label>
            </div>
            <div class="loop-ab-section" style="display: none;">
                <div class="loop-ab-header">A-B Loop Region</div>
                <div class="loop-inputs">
                    <div class="input-group">
                        <label for="mb-loop-start">Start (A)</label>
                        <div class="input-row">
                            <input type="text" id="mb-loop-start" placeholder="0:00.000" class="jellyjump-input">
                            <button class="jellyjump-btn-small" id="mb-set-a-btn">Set</button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="mb-loop-end">End (B)</label>
                        <div class="input-row">
                            <input type="text" id="mb-loop-end" placeholder="0:00.000" class="jellyjump-input">
                            <button class="jellyjump-btn-small" id="mb-set-b-btn">Set</button>
                        </div>
                    </div>
                </div>
                <div class="loop-actions">
                    <button class="jellyjump-btn-text" id="mb-clear-loop-btn">Clear A-B</button>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- Filter Panel Template -->
<template id="player-filter-panel-template">
    <div class="jellyjump-panel jellyjump-filter-panel" style="display: none;">
        <div class="jellyjump-panel-header">
            <span>Filters</span>
            <button class="jellyjump-close-btn" aria-label="Close">×</button>
        </div>
        <div class="jellyjump-panel-content">
            <div class="filter-sliders">
                <div class="filter-slider-group">
                    <label for="mb-filter-brightness">
                        <span>Brightness</span>
                        <span class="filter-value" id="mb-brightness-value">100%</span>
                    </label>
                    <input type="range" id="mb-filter-brightness" min="0" max="200" value="100" class="filter-slider">
                </div>
                <div class="filter-slider-group">
                    <label for="mb-filter-contrast">
                        <span>Contrast</span>
                        <span class="filter-value" id="mb-contrast-value">100%</span>
                    </label>
                    <input type="range" id="mb-filter-contrast" min="0" max="200" value="100" class="filter-slider">
                </div>
                <div class="filter-slider-group">
                    <label for="mb-filter-saturation">
                        <span>Saturation</span>
                        <span class="filter-value" id="mb-saturation-value">100%</span>
                    </label>
                    <input type="range" id="mb-filter-saturation" min="0" max="200" value="100" class="filter-slider">
                </div>
            </div>
            <div class="filter-presets">
                <span class="filter-presets-label">Presets</span>
                <div class="filter-preset-grid">
                    <button class="filter-preset-btn" data-preset="night">🌙 Night</button>
                    <button class="filter-preset-btn" data-preset="vivid">🌈 Vivid</button>
                    <button class="filter-preset-btn" data-preset="warm">🔥 Warm</button>
                    <button class="filter-preset-btn" data-preset="cool">❄️ Cool</button>
                    <button class="filter-preset-btn" data-preset="grayscale">⬜ B&W</button>
                    <button class="filter-preset-btn" data-preset="sepia">📜 Sepia</button>
                </div>
            </div>
            <div class="filter-actions">
                <button class="jellyjump-btn-text" id="mb-reset-filters-btn">Reset All</button>
            </div>
        </div>
    </div>
</template>

<!-- Speed Panel Template -->
<template id="player-speed-panel-template">
    <div class="jellyjump-panel jellyjump-speed-panel" style="display: none;">
        <div class="jellyjump-panel-header">
            <span>Speed</span>
            <button class="jellyjump-close-btn" aria-label="Close">×</button>
        </div>
        <div class="jellyjump-panel-content">
            <div class="speed-slider-group">
                <div class="speed-slider-header">
                    <span>Playback Speed</span>
                    <span class="speed-value" id="mb-speed-value">1.0x</span>
                </div>
                <input type="range" id="mb-speed-slider" min="0.25" max="2" step="0.25" value="1" class="speed-slider">
                <div class="speed-slider-labels">
                    <span>0.25x</span>
                    <span>2x</span>
                </div>
            </div>
            <div class="speed-actions">
                <button class="jellyjump-btn-text" id="mb-reset-speed-btn">Reset to 1x</button>
            </div>
        </div>
    </div>
</template>

<!-- Subtitle Panel Template -->
<template id="player-subtitle-panel-template">
    <div class="jellyjump-panel jellyjump-subtitle-panel" style="display: none;">
        <div class="jellyjump-panel-header">
            <span>Subtitles</span>
            <button class="jellyjump-close-btn" aria-label="Close">×</button>
        </div>
        <div class="jellyjump-panel-content">
            <div class="subtitle-options">
                <label class="subtitle-radio-option">
                    <input type="radio" name="subtitle-track" value="off" checked>
                    <span class="radio-label">Off</span>
                </label>
                <!-- Dynamic subtitle tracks will be added here -->
            </div>
            <div class="subtitle-actions">
                <label class="subtitle-upload-btn">
                    <svg width="16" height="16" fill="currentColor">
                        <use href="assets/icons/sprite.svg#icon-plus"></use>
                    </svg>
                    <span>Upload Subtitle</span>
                    <input type="file" id="mb-cc-input" accept=".vtt,.srt,.txt" style="display: none;">
                </label>
                <button type="button" class="subtitle-upload-btn subtitle-generate-btn" id="mb-cc-generate-btn"
                    aria-label="Generate subtitles with AI">
                    <svg width="16" height="16" fill="currentColor">
                        <use href="assets/icons/sprite.svg#icon-cc"></use>
                    </svg>
                    <span>Generate Subtitles (AI)</span>
                </button>
                <div class="subtitle-generate-progress" id="mb-cc-generate-progress" style="display: none;">
                    <div class="subtitle-generate-progress-track">
                        <div class="subtitle-generate-progress-bar" id="mb-cc-generate-bar"></div>
                    </div>
                    <span class="subtitle-generate-progress-label" id="mb-cc-generate-label"></span>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- Audio/EQ Panel Template -->
<template id="player-audio-panel-template">
    <div class="jellyjump-panel jellyjump-eq-panel" style="display: none;">
        <div class="jellyjump-panel-header">
            <span>Audio Settings</span>
            <button class="jellyjump-close-btn" aria-label="Close Audio Panel">×</button>
        </div>
        <div class="jellyjump-panel-content">
            <!-- Volume Control Section -->
            <div class="audio-volume-section">
                <div class="volume-row">
                    <button class="jellyjump-btn-text" id="mb-panel-mute-btn" aria-label="Mute">
                        <svg width="20" height="20" fill="currentColor">
                            <use href="assets/icons/sprite.svg#icon-volume-high"></use>
                        </svg>
                    </button>
                    <input type="range" id="mb-panel-volume-slider" min="0" max="1" step="0.05" value="1"
                        class="panel-volume-slider">
                    <span class="volume-value" id="mb-panel-volume-value">100%</span>
                </div>
            </div>

            <div class="eq-section-divider"></div>

            <div class="eq-sliders">
                <div class="eq-slider-group">
                    <label for="mb-eq-bass">
                        <span>Bass</span>
                        <span class="eq-value" id="mb-bass-value">0</span>
                    </label>
                    <input type="range" id="mb-eq-bass" min="-12" max="12" value="0" class="eq-slider">
                </div>
                <div class="eq-slider-group">
                    <label for="mb-eq-mid">
                        <span>Mid</span>
                        <span class="eq-value" id="mb-mid-value">0</span>
                    </label>
                    <input type="range" id="mb-eq-mid" min="-12" max="12" value="0" class="eq-slider">
                </div>
                <div class="eq-slider-group">
                    <label for="mb-eq-treble">
                        <span>Treble</span>
                        <span class="eq-value" id="mb-treble-value">0</span>
                    </label>
                    <input type="range" id="mb-eq-treble" min="-12" max="12" value="0" class="eq-slider">
                </div>
            </div>
            <div class="eq-presets">
                <span class="eq-presets-label">Presets</span>
                <div class="eq-preset-grid">
                    <button class="eq-preset-btn" data-preset="flat">Flat</button>
                    <button class="eq-preset-btn" data-preset="bass-boost">🔊 Bass</button>
                    <button class="eq-preset-btn" data-preset="treble-boost">🔔 Treble</button>
                    <button class="eq-preset-btn" data-preset="voice">🎤 Voice</button>
                    <button class="eq-preset-btn" data-preset="rock">🎸 Rock</button>
                    <button class="eq-preset-btn" data-preset="electronic">🎹 Electronic</button>
                </div>
            </div>
            <div class="eq-actions">
                <button class="jellyjump-btn-text" id="mb-reset-eq-btn">Reset EQ</button>
            </div>
        </div>
    </div>
</template>

<!-- Help Overlay Template -->
<template id="player-help-overlay-template">
    <div class="jellyjump-help-overlay" style="display: none;">
        <div class="jellyjump-help-content">
            <h2 class="jellyjump-help-title">Keyboard Shortcuts</h2>
            <div class="jellyjump-help-grid">
                <div class="jellyjump-help-section">
                    <h3>Playback</h3>
                    <ul>
                        <li><span class="key">Space</span> / <span class="key">K</span> Play/Pause</li>
                        <li><span class="key">J</span> / <span class="key">L</span> -/+ 10s</li>
                        <li><span class="key">←</span> / <span class="key">→</span> -/+ 5s</li>
                        <li><span class="key">0</span>-<span class="key">9</span> Seek 0-90%</li>
                        <li><span class="key">Home</span> / <span class="key">End</span> Start/End</li>
                    </ul>
                </div>
                <div class="jellyjump-help-section">
                    <h3>Audio & Display</h3>
                    <ul>
                        <li><span class="key">↑</span> / <span class="key">↓</span> Volume +/-</li>
                        <li><span class="key">M</span> Mute Toggle</li>
                        <li><span class="key">F</span> Fullscreen</li>
                        <li><span class="key">C</span> Captions Toggle</li>
                        <li><span class="key">?</span> Toggle Help</li>
                    </ul>
                </div>
                <div class="jellyjump-help-section" id="help-navigation-section">
                    <h3>Navigation</h3>
                    <ul>
                        <li><span class="key">Shift</span> + <span class="key">N</span> Next Video</li>
                        <li><span class="key">Shift</span> + <span class="key">P</span> Previous Video</li>
                    </ul>
                </div>
                <div class="jellyjump-help-section" id="help-editor-section" style="display: none;">
                    <h3>Editor</h3>
                    <ul>
                        <li><span class="key">,</span> / <span class="key">.</span> Prev/Next Frame</li>
                        <li><span class="key">I</span> / <span class="key">O</span> In/Out Point</li>
                    </ul>
                </div>
                <div class="jellyjump-help-section">
                    <h3>Looping</h3>
                    <ul>
                        <li><span class="key">I</span> Set Loop Start (A)</li>
                        <li><span class="key">O</span> Set Loop End (B)</li>
                        <li><span class="key">R</span> Reset Loop</li>
                    </ul>
                </div>
            </div>
            <button class="jellyjump-close-help">Close</button>
        </div>
    </div>

</template>

<!-- Menu Item Template -->
<template id="player-menu-item-template">
    <div class="jellyjump-menu-item" role="menuitem" tabindex="0"></div>
</template>
