<!-- Playlist Templates -->
<!-- All HTML templates for the playlist component -->
<!-- These are cloned and populated with data in Playlist.js -->

<!-- Unified Progress Status Template (Clone into footer status area) -->
<template id="progress-status-template">
    <div class="progress-section hidden flex items-center gap-sm">
        <div class="spinner-sm"></div>
        <span class="progress-status text-sm font-mono">Processing...</span>
        <span class="progress-percentage text-sm font-bold text-accent">0%</span>
    </div>
    <div class="error-message hidden text-danger text-sm"></div>
    <div class="success-message hidden text-success text-sm font-bold">✓ Added to playlist</div>
</template>

<!-- Playlist Item Template -->
<template id="playlist-item-template">
    <div class="playlist-item" data-index="" tabindex="0" role="button">
        <div class="playlist-thumbnail"></div>
        <div class="playlist-info">
            <div class="playlist-title"></div>
            <div class="playlist-duration"></div>
        </div>
        <div class="playlist-actions">
            <button class="playlist-download-btn" title="Download video" aria-label="Download">
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-download"></use>
                </svg>
            </button>
            <button class="playlist-remove-btn" title="Remove" aria-label="Remove">
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-trash"></use>
                </svg>
            </button>
            <button class="playlist-settings-btn" title="Video Options" aria-label="Video options menu">
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-more-vertical"></use>
                </svg>
            </button>
        </div>
    </div>
</template>

<!-- Playlist Settings Menu Template -->
<template id="playlist-settings-menu-template">
    <div class="playlist-context-menu" role="menu">
        <div class="playlist-menu-item" data-action="convert" role="menuitem">
            <span class="menu-icon">🔄</span>
            <span class="menu-label">Convert & Compress Video</span>
        </div>
        <div class="playlist-menu-item" data-action="download-manage" role="menuitem">
            <span class="menu-icon">🎬</span>
            <span class="menu-label">Download Tracks</span>
        </div>
        <!-- <div class="menu-divider"></div> -->
        <div class="playlist-menu-item" data-action="trim" role="menuitem">
            <span class="menu-icon">✂️</span>
            <span class="menu-label">Cut Video</span>
        </div>
        <div class="playlist-menu-item" data-action="resize" role="menuitem">
            <span class="menu-icon">📐</span>
            <span class="menu-label">Resize Video</span>
        </div>
        <div class="playlist-menu-item" data-action="crop" role="menuitem">
            <span class="menu-icon">🖼️</span>
            <span class="menu-label">Crop Video</span>
        </div>
        <div class="playlist-menu-item" data-action="create-gif" role="menuitem">
            <span class="menu-icon">🎞️</span>
            <span class="menu-label">Create GIF</span>
        </div>
        <div class="playlist-menu-item" data-action="reverse" role="menuitem">
            <span class="menu-icon">⏪</span>
            <span class="menu-label">Speed / Reverse</span>
        </div>
        <div class="playlist-menu-item" data-action="remove-bg" role="menuitem">
            <span class="menu-icon">🎨</span>
            <span class="menu-label">Remove Background</span>
        </div>
        <div class="playlist-menu-item" data-action="watermark" role="menuitem">
            <span class="menu-icon">💧</span>
            <span class="menu-label">Add Watermark</span>
        </div>
        <div class="playlist-menu-item" data-action="record" role="menuitem">
            <span class="menu-icon">🔴</span>
            <span class="menu-label">Record Stream</span>
        </div>
        <div class="playlist-menu-item" data-action="merge" role="menuitem">
            <span class="menu-icon">🔗</span>
            <span class="menu-label">Merge Videos</span>
        </div>
        <div class="playlist-menu-item" data-action="detect-cuts" role="menuitem">
            <span class="menu-icon">✂️</span>
            <span class="menu-label">Scene Detection</span>
        </div>
        <div class="playlist-menu-item" data-action="detect-motion" role="menuitem">
            <span class="menu-icon">🏃</span>
            <span class="menu-label">Motion Detection</span>
        </div>
        <div class="playlist-menu-item" data-action="info" role="menuitem">
            <div class="menu-icon">
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-info"></use>
                </svg>
            </div>
            <span class="menu-label">Video Info</span>
        </div>
    </div>
</template>

<!-- Modal Shell Template -->
<template id="modal-shell-template">
    <div class="mb-modal-overlay">
        <div class="mb-modal" role="dialog" aria-modal="true">
            <div class="mb-modal-header">
                <h3 class="mb-modal-title"></h3>
                <button class="mb-modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="mb-modal-body mb-modal-body-scrollable"></div>
            <div class="mb-modal-footer hidden"></div>
        </div>
    </div>
</template>


<!-- Conversion Content Template -->
<template id="conversion-content-template">
    <!-- Format Selection -->
    <div class="format-selection flex-start mb-lg">
        <div class="text-secondary text-sm font-mono whitespace-nowrap">SELECT FORMAT:</div>
        <div class="jellyjump-menu-btn-container">
            <div class="mb-select jellyjump-menu-btn" id="conversion-format-btn" aria-haspopup="true"
                aria-expanded="false">
                <span>Original</span>
            </div>
            <div class="jellyjump-menu" id="conversion-format-menu" role="menu">
                <div class="jellyjump-menu-item active" data-value="keep" role="menuitem">
                    <span class="menu-label text-primary font-bold">Original</span>
                    <span class="text-xs text-secondary ml-auto">Keep Format</span>
                </div>
                <div class="menu-divider"></div>
                <div class="jellyjump-menu-item" data-value="mp4" role="menuitem">
                    <span class="menu-label font-bold">MP4</span>
                    <span class="text-xs text-secondary ml-auto">H.264 / AAC</span>
                </div>
                <div class="jellyjump-menu-item" data-value="webm" role="menuitem">
                    <span class="menu-label font-bold">WebM</span>
                    <span class="text-xs text-secondary ml-auto">VP9 / Opus</span>
                </div>
                <div class="jellyjump-menu-item" data-value="mov" role="menuitem">
                    <span class="menu-label font-bold">MOV</span>
                    <span class="text-xs text-secondary ml-auto">QuickTime</span>
                </div>
                <div class="menu-divider"></div>
                <div class="jellyjump-menu-item disabled" data-value="avi" role="menuitem" title="Coming Soon">
                    <span class="menu-label">AVI</span>
                    <span class="text-xs text-secondary ml-auto">Legacy</span>
                </div>
                <div class="jellyjump-menu-item" data-value="mkv" role="menuitem">
                    <span class="menu-label font-bold">MKV</span>
                    <span class="text-xs text-secondary ml-auto">Matroska</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Quality Slider (Always Visible) -->
    <div class="quality-section">
        <div class="flex-between mb-sm">
            <span class="text-secondary text-sm font-mono">QUALITY:</span>
            <span class="quality-value text-sm font-bold">Original (100%)</span>
        </div>
        <input type="range" class="quality-slider" min="1" max="100" step="1" value="100">
        <div class="flex-between mt-xs text-xs text-secondary">
            <span>Low</span>
            <span>Medium</span>
            <span>High</span>
            <span>Original</span>
        </div>
        <div class="estimated-reduction text-xs text-accent mt-sm">No size reduction</div>
    </div>
</template>

<!-- Conversion Footer Template -->
<template id="conversion-footer-template">
    <div class="conversion-footer-container flex-between items-center w-full gap-md">
        <!-- Status Area (Left) -->
        <div class="conversion-footer-status flex-1">
            <div class="progress-section hidden flex items-center gap-sm">
                <div class="spinner-sm border-2 border-current border-t-transparent rounded-full w-4 h-4 animate-spin">
                </div>
                <span class="progress-status text-sm font-mono">Processing...</span>
                <span class="progress-percentage text-sm font-bold text-accent">0%</span>
            </div>
            <div class="error-message hidden text-danger text-sm"></div>
            <div class="success-message hidden text-success text-sm font-bold">✓ Added to playlist</div>
        </div>
        <!-- Action Buttons (Right) -->
        <div class="action-buttons flex gap-sm flex-shrink-0">
            <a href="#" class="btn jellyjump-btn-small hidden download-btn" title="Download" aria-label="Download"
                download>
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-download"></use>
                </svg>
            </a>
            <button class="btn jellyjump-btn-small convert-btn" title="Convert" aria-label="Convert">
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-convert"></use>
                </svg>
            </button>
        </div>
    </div>
</template>

<!-- Folder Header Template -->

                    <use href="assets/icons/sprite.svg#icon-plus"></use>
                </svg>
            </button>
            <button class="jellyjump-btn-small" id="mb-add-folder" title="Add Folder">

</template>

<!-- Trim Content Template -->
<template id="trim-content-template">
    <!-- Loading State -->
    <div class="trim-loading flex flex-col items-center justify-center p-xl text-muted" style="grid-column: 1 / -1;">
        <div class="spinner-md border-4 border-current border-t-transparent rounded-full w-8 h-8 animate-spin mb-sm">
        </div>
        <span>Loading video info...</span>
    </div>

    <div class="trim-content hidden" style="display: contents;">
        <!-- Left Panel: Video Player -->
        <div class="modal-video-panel">
            <div id="trim-player-container" class="aspect-video bg-black rounded overflow-hidden relative">
            </div>
        </div>

        <!-- Right Panel: Timeline Controls -->
        <div class="modal-controls-panel">
            <!-- Visual Timeline Slider -->
            <div class="timeline-slider-container select-none">
                <label class="text-xs text-secondary font-mono mb-xs block">TRIM RANGE</label>
                <div class="timeline-slider relative h-12 bg-tertiary rounded cursor-pointer">
                    <!-- Track Background -->
                    <div class="timeline-track absolute inset-0 rounded overflow-hidden">
                        <!-- Ticks generated by JS -->
                    </div>
                    <!-- Selected Range -->
                    <div
                        class="timeline-range absolute top-0 bottom-0 bg-primary opacity-30 pointer-events-none timeline-range-initial">
                    </div>
                    <!-- Handles -->
                    <div class="timeline-handle start-handle absolute top-0 bottom-0 w-4 bg-accent cursor-ew-resize z-10 -ml-2 rounded-full border-2 border-white shadow-md timeline-handle-start"
                        tabindex="0" role="slider" aria-label="Start time"></div>
                    <div class="timeline-handle end-handle absolute top-0 bottom-0 w-4 bg-accent cursor-ew-resize z-10 -ml-2 rounded-full border-2 border-white shadow-md timeline-handle-end"
                        tabindex="0" role="slider" aria-label="End time"></div>
                </div>
            </div>

            <!-- Time Display Cards -->
            <div class="time-cards grid gap-sm" style="grid-template-columns: 1fr 1fr;">
                <div class="time-card bg-tertiary p-sm rounded">
                    <span class="text-xs text-secondary font-mono block mb-xs">START</span>
                    <span class="trim-start-time text-primary font-bold text-lg">00:00:00</span>
                </div>
                <div class="time-card bg-tertiary p-sm rounded">
                    <span class="text-xs text-secondary font-mono block mb-xs">END</span>
                    <span class="trim-end-time text-primary font-bold text-lg">00:00:00</span>
                </div>
            </div>

            <!-- Duration Display -->
            <div class="duration-display bg-secondary p-sm rounded border border-accent/30">
                <span class="text-xs text-secondary font-mono block mb-xs">DURATION</span>
                <span class="trim-duration text-accent font-bold text-xl">00:00:00</span>
            </div>
        </div>
    </div>
</template>

<!-- Track Management Modal Template -->

<!-- Detection Content Template (Motion/Cuts) -->
<template id="detection-content-template">
    <div class="detection-content flex flex-col h-[50vh] max-h-[500px]">
        <div class="flex-none pb-sm border-b border-white/10">
            <p class="mb-sm truncate text-secondary text-sm">Target: <strong
                    class="target-filename text-primary">--</strong></p>

            <div class="detection-status-area bg-tertiary/50 p-sm rounded mb-sm">
                <div class="flex-between mb-xs">
                    <span class="status-text text-sm font-mono text-secondary">Initializing...</span>
                    <span class="status-percent text-sm font-bold text-accent">0%</span>
                </div>
                <div class="progress-bar-container h-1.5 bg-black rounded overflow-hidden">
                    <div
                        class="progress-bar-fill bg-primary h-full w-0 transition-all duration-300 shadow-[0_0_8px_var(--color-primary)]">
                    </div>
                </div>
            </div>
        </div>

<template id="screen-record-options-modal-template">
    <div class="mb-modal-overlay">
        <div class="mb-modal" role="dialog" aria-modal="true">
            <div class="mb-modal-header">
                <h3 class="mb-modal-title">Screen Recording Options</h3>
                <button class="mb-modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="mb-modal-body">
                <p class="text-secondary text-sm mb-lg">Choose your recording source:</p>

                <!-- Recording Mode Tabs -->
                <div class="recorder-tabs">
                    <button class="recorder-tab-btn active" id="tab-screen-record">Screen</button>
                    <button class="recorder-tab-btn" id="tab-webcam-record">Camera</button>
                </div>

                <div id="screen-record-options">
                    <div class="options-group mb-lg">
                        <!-- Source Constraint (Top) -->
                        <label
                            class="checkbox-option flex items-center cursor-pointer mb-md p-sm bg-bg-tertiary rounded-md border border-border-light">
                            <input type="checkbox" id="prefer-current-tab" class="mr-sm">
                            <div>
                                <span class="block text-sm font-bold text-primary">Record this tab only</span>
                                <span class="block text-xs text-secondary">Uncheck to record other windows/apps.</span>
                            </div>
                        </label>

                        <!-- Capture Audio Checkbox -->
                        <label class="checkbox-option flex items-center mb-sm cursor-pointer">
                            <input type="checkbox" id="capture-audio" class="mr-sm">
                            <span class="block text-sm font-bold text-primary">Record Microphone</span>
                        </label>

                        <!-- Microphone Selector (shown when capture-audio is checked) -->
                        <div id="mic-selector-container" style="display: none;" class="mb-md pl-md">
                            <select id="mic-device-select" class="mb-select w-full">
                                <option value="">Loading microphones...</option>
                            </select>

                            <!-- Echo Cancellation Toggle -->
                            <label class="checkbox-option flex items-center mt-sm cursor-pointer">
                                <input type="checkbox" id="disable-echo-cancel" class="mr-sm">
                                <div>
                                    <span class="block text-xs text-primary">Capture speaker audio</span>
                                    <span class="block text-xs text-secondary">Disable echo cancellation to record audio
                                        from speakers</span>
                                </div>
                            </label>

                            <a href="https://webcammictest.com/mic/" target="_blank" rel="noopener noreferrer"
                                class="text-xs text-accent hover-underline mt-xs inline-block">🎙️ Test your
                                microphone: https://webcammictest.com/mic/</a>
                        </div>

                        <!-- Enable Facecam Checkbox -->
                        <label class="checkbox-option flex items-center mb-md cursor-pointer">
                            <input type="checkbox" id="enable-facecam" class="mr-sm">
                            <span class="block text-sm font-bold text-primary">Enable Facecam</span>
                        </label>

                        <div id="facecam-options" style="display: none;"
                            class="pl-md border-l-2 border-border-light ml-xs">
                            <!-- Global PiP (Visible when Unchecked) -->
                            <label class="radio-option option-pip flex items-start mb-md cursor-pointer">
                                <input type="radio" name="facecam-mode" value="pip" class="mr-sm mt-xs">
                                <div>
                                    <span class="block text-sm font-medium">Global PiP (Recommended)</span>
                                    <span class="block text-xs text-secondary">Floating window, visible over all apps.
                                        (Requires "Always on Top")</span>
                                </div>
                            </label>

                            <!-- Popup Window (Visible when Unchecked) -->
                            <label class="radio-option option-popup flex items-start mb-md cursor-pointer">
                                <input type="radio" name="facecam-mode" value="popup" class="mr-sm mt-xs">
                                <div>
                                    <span class="block text-sm font-medium">Popup Window</span>
                                    <span class="block text-xs text-secondary">Separate popup window. Alternative for
                                        Linux.</span>
                                </div>
                            </label>

                            <!-- In-Page Bubble (Visible when Checked) -->
                            <label class="radio-option option-in-page flex items-start mb-md cursor-pointer">
                                <input type="radio" name="facecam-mode" value="in-page" class="mr-sm mt-xs">
                                <div>
                                    <span class="block text-sm font-medium">In-Page Bubble</span>
                                    <span class="block text-xs text-secondary">Draggable bubble, only visible inside
                                        this
                                        tab.</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="alert alert-info text-xs mb-lg" id="facecam-hint">
                        <strong>Tip:</strong> If the Facecam hides behind other windows, try right-clicking it and
                        selecting
                        "Always on Top".
                    </div>
                </div>

                <!-- Webcam Only Options -->
                <div id="webcam-record-options" class="hidden text-center py-lg">
                    <div
                        class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-bg-tertiary mb-md text-3xl">
                        📹

                    <h3 class="text-lg font-bold text-primary mb-sm">Record Camera Only</h3>

                    <!-- Microphone Option for Webcam -->
                    <div class="text-left mt-md">

                            <span class="block text-sm font-bold text-primary">Record Microphone</span>
                        </label>

                        <div id="webcam-mic-selector-container" class="mb-md px-lg">

                            <a href="https://webcammictest.com/" target="_blank" rel="noopener noreferrer"

                                mic: https://webcammictest.com/mic/</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mb-modal-footer flex justify-end gap-sm">
                <button class="jellyjump-btn-secondary mb-modal-cancel">Cancel</button>
                <button class="jellyjump-btn-primary mb-modal-start">Start Recording</button>
            </div>
        </div>
    </div>
</template>
