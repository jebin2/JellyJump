<!-- Playlist Templates -->
<!-- All HTML templates for the playlist component -->
<!-- These are cloned and populated with data in Playlist.js -->

<!-- Unified Progress Status Template (Clone into footer status area) -->
<template id="progress-status-template">
    <div class="progress-section hidden flex items-center gap-sm">
        <div class="spinner-sm"></div>
        <span class="progress-status text-sm font-mono">Processing...</span>
        <span class="progress-percentage text-sm font-bold text-accent">0%</span>
    </div>
    <div class="error-message hidden text-danger text-sm"></div>
    <div class="success-message hidden text-success text-sm font-bold">✓ Added to playlist</div>
</template>

<!-- Playlist Item Template -->
<template id="playlist-item-template">
    <div class="playlist-item" data-index="" tabindex="0" role="button">
        <div class="playlist-thumbnail"></div>
        <div class="playlist-info">
            <div class="playlist-title"></div>
            <div class="playlist-duration"></div>
        </div>
        <div class="playlist-actions">
            <button class="playlist-download-btn" title="Download video" aria-label="Download">
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-download"></use>
                </svg>
            </button>
            <button class="playlist-remove-btn" title="Remove" aria-label="Remove">
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-trash"></use>
                </svg>
            </button>
            <button class="playlist-settings-btn" title="Tools" aria-label="Video tools">
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-sliders"></use>
                </svg>
            </button>
        </div>
    </div>
</template>

<!-- Modal Shell Template -->

<!-- Common Process Footer Template - Configurable via FooterHelper.js -->
<template id="common-process-footer-template">
    <div class="process-footer-container flex-between items-center w-full gap-md">
        <!-- Status Area (Left) -->
        <div class="process-footer-status flex-1">
            <div class="progress-section hidden flex items-center gap-sm">
                <div
                    class="spinner-sm border-2 border-current border-t-transparent rounded-full w-4 h-4 animate-spin text-primary">
                </div>
                <span class="progress-status text-sm font-mono text-secondary">Processing...</span>
                <span class="progress-percentage text-sm font-bold text-accent">0%</span>
            </div>
            <div class="error-message hidden text-danger text-sm font-bold"></div>
            <div class="success-message hidden text-success text-sm font-bold flex items-center gap-xs">
                <svg width="14" height="14" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-check"></use>
                </svg>
                <span>Added to playlist</span>
            </div>
        </div>
        <!-- Action Buttons (Right) -->
        <div class="action-buttons flex gap-sm flex-shrink-0">
            <a href="#" class="btn jellyjump-btn-small hidden download-btn" title="Download" aria-label="Download"
                download>
                <svg width="16" height="16" fill="currentColor">
                    <use href="assets/icons/sprite.svg#icon-download"></use>
                </svg>
            </a>
            <button class="btn jellyjump-btn-small primary-action-btn" title="" aria-label="">
                <svg width="16" height="16" fill="currentColor">
                    <use class="action-icon-use" href=""></use>
                </svg>
            </button>
        </div>
    </div>
</template>


<!-- Conversion Content Template -->
<template id="conversion-content-template">
    <!-- Format Selection -->
    <div class="format-selection flex-start mb-lg">
        <div class="text-secondary text-sm font-mono whitespace-nowrap">SELECT FORMAT:</div>
        <div class="jellyjump-menu-btn-container">
            <div class="mb-select jellyjump-menu-btn" id="conversion-format-btn" aria-haspopup="true"
                aria-expanded="false">
                <span>Original</span>
            </div>
            <div class="jellyjump-menu" id="conversion-format-menu" role="menu">
                <div class="jellyjump-menu-item active" data-value="keep" role="menuitem">
                    <span class="menu-label text-primary font-bold">Original</span>
                    <span class="text-xs text-secondary ml-auto">Keep Format</span>
                </div>
                <div class="menu-divider"></div>
                <div class="jellyjump-menu-item" data-value="mp4" role="menuitem">
                    <span class="menu-label font-bold">MP4</span>
                    <span class="text-xs text-secondary ml-auto">H.264 / AAC</span>
                </div>
                <div class="jellyjump-menu-item" data-value="webm" role="menuitem">
                    <span class="menu-label font-bold">WebM</span>
                    <span class="text-xs text-secondary ml-auto">VP9 / Opus</span>
                </div>
                <div class="jellyjump-menu-item" data-value="mov" role="menuitem">
                    <span class="menu-label font-bold">MOV</span>
                    <span class="text-xs text-secondary ml-auto">QuickTime</span>
                </div>
                <div class="menu-divider"></div>
                <div class="jellyjump-menu-item disabled" data-value="avi" role="menuitem" title="Coming Soon">
                    <span class="menu-label">AVI</span>
                    <span class="text-xs text-secondary ml-auto">Legacy</span>
                </div>
                <div class="jellyjump-menu-item" data-value="mkv" role="menuitem">
                    <span class="menu-label font-bold">MKV</span>
                    <span class="text-xs text-secondary ml-auto">Matroska</span>
                </div>
                <div class="menu-divider"></div>
                <div class="jellyjump-menu-item" data-value="flac" role="menuitem">
                    <span class="menu-label font-bold">FLAC</span>
                    <span class="text-xs text-secondary ml-auto">Audio Only</span>
                </div>
                <div class="menu-divider"></div>
                <div class="jellyjump-menu-item" data-value="hls" role="menuitem">
                    <span class="menu-label font-bold">HLS</span>
                    <span class="text-xs text-secondary ml-auto">Stream (.zip)</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Quality Slider (Always Visible) -->
    <div class="quality-section">
        <div class="flex-between mb-sm">
            <span class="text-secondary text-sm font-mono">QUALITY:</span>
            <span class="quality-value text-sm font-bold">Original (100%)</span>
        </div>
        <input type="range" class="quality-slider" min="1" max="100" step="1" value="100">
        <div class="flex-between mt-xs text-xs text-secondary">
            <span>Low</span>
            <span>Medium</span>
            <span>High</span>
            <span>Original</span>
        </div>
        <div class="estimated-reduction text-xs text-accent mt-sm">No size reduction</div>
    </div>
</template>

<!-- Conversion Footer Template -->

    </div>

<!-- Trim Content Template -->
<template id="trim-content-template">
    <!-- Loading State -->
    <div class="trim-loading flex flex-col items-center justify-center p-xl text-muted" style="grid-column: 1 / -1;">
        <div class="spinner-md border-4 border-current border-t-transparent rounded-full w-8 h-8 animate-spin mb-sm">
        </div>
        <span>Loading video info...</span>
    </div>

    <div class="trim-content hidden" style="display: contents;">
        <!-- Left Panel: Video Player -->
        <div class="modal-video-panel">
            <div id="trim-player-container" class="aspect-video bg-black rounded overflow-hidden relative">
            </div>
        </div>

        <!-- Right Panel: Inputs -->
        <div class="modal-controls-panel">
            <div class="tool-card">
                <div class="tool-card-times">
                    <div class="tool-card-input">
                        <label>Start</label>
                        <input type="text" id="trim-start-input" class="mb-input font-mono" placeholder="0:00.000">
                        <button id="trim-set-start-btn" class="jellyjump-btn-small">Set</button>
                    </div>
                    <div class="tool-card-input">
                        <label>End</label>
                        <input type="text" id="trim-end-input" class="mb-input font-mono" placeholder="0:00.000">
                        <button id="trim-set-end-btn" class="jellyjump-btn-small">Set</button>
                    </div>
                </div>
                <div class="tool-card-info">Duration: <span class="trim-duration">00:00:00</span></div>
                <label class="checkbox-option mt-sm" title="Skip re-encoding — snaps start/end to nearest keyframe. Instant processing.">
                    <input type="checkbox" id="trim-lossless-toggle">
                    <span class="checkbox-label text-sm">⚡ Lossless (fast, keyframe-snapped)</span>
                </label>
            </div>
        </div>
    </div>
</template>

<!-- MultiCut Content Template -->
<template id="multicut-content-template">
    <div class="multicut-loading flex flex-col items-center justify-center p-xl text-muted"
        style="grid-column: 1 / -1;">
        <div class="spinner-md border-4 border-current border-t-transparent rounded-full w-8 h-8 animate-spin mb-sm">
        </div>
        <span>Loading video info...</span>
    </div>

    <div class="multicut-content hidden" style="display: contents;">
        <div class="modal-video-panel">
            <div id="multicut-player-container" class="aspect-video bg-black rounded overflow-hidden relative">
            </div>
        </div>

        <div class="modal-controls-panel">
            <button id="multicut-add-clip-btn" class="jellyjump-btn-large w-full mb-md">+ Add Segments</button>

            <div class="duration-display bg-tertiary p-sm rounded border border-border mb-md">
                <span class="text-xs text-secondary font-mono block mb-xs">REMAINING DURATION</span>
                <span class="multicut-total-duration text-accent font-bold text-lg">00:00:00</span>
            </div>

            <div id="multicut-clips-list" class="tool-cards-list">
            </div>
        </div>
    </div>
</template>

<!-- Trim Footer Template -->


<!-- Track Management Modal Template -->
<template id="track-management-modal-template">
    <div class="mb-modal-overlay">
        <div class="mb-modal mb-modal-large" role="dialog" aria-modal="true">
            <div class="mb-modal-header">
                <h3 class="mb-modal-title">Video & Audio Tracks</h3>
                <button class="mb-modal-close" aria-label="Close">&times;</button>

                <!-- Loading State -->

                        class="spinner-md border-4 border-current border-t-transparent rounded-full w-8 h-8 animate-spin mb-sm">

                    <span>Scanning media tracks...</span>

                <div class="tracks-content hidden">

                            <span class="track-count badge bg-primary text-white text-xs px-xs rounded-full">0</span>
                        </h4>
                        <div class="track-list video-track-list grid gap-sm">

                            <div class="no-tracks-message text-muted text-sm italic hidden">No video tracks available
                            </div>
                        </div>
                    </div>

                    <div class="track-section audio-tracks-section mt-lg">
                        <h4 class="track-section-title flex items-center gap-sm mb-sm font-bold">
                            <span>🎵 Audio Tracks</span>
                            <span class="track-count badge bg-primary text-white text-xs px-xs rounded-full">0</span>
                        </h4>
                        <div class="track-list audio-track-list grid gap-sm">
                            <!-- Audio tracks injected here -->
                            <div class="no-tracks-message text-muted text-sm italic hidden">No audio tracks available
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- Detection Content Template (Motion/Cuts) -->
<template id="detection-content-template">
    <div class="detection-content flex flex-col h-[50vh] max-h-[500px]">
        <div class="flex-none pb-sm border-b border-white/10">
            <p class="mb-sm truncate text-secondary text-sm">Target: <strong
                    class="target-filename text-primary">--</strong></p>

            <!-- Sensitivity Slider (for CutDetection - hidden by MotionDetection) -->
            <div class="quality-section sensitivity-section hidden">
                <div class="flex-between mb-sm">
                    <span class="text-secondary text-sm font-mono">SENSITIVITY:</span>
                    <span class="sensitivity-value text-sm font-bold">Medium</span>
                </div>
                <input type="range" class="quality-slider sensitivity-slider" min="1" max="3" step="1" value="2">
                <div class="flex-between mt-xs text-xs text-secondary">
                    <span>High</span>
                    <span>Medium</span>
                    <span>Low</span>
                </div>
            </div>

            <!-- Status Area (for progress display) -->
            <div class="detection-status-area bg-tertiary/50 p-sm rounded mt-sm">
                <div class="flex-between mb-xs">
                    <span class="status-text text-sm font-mono text-secondary">Initializing...</span>
                    <span class="status-percent text-sm font-bold text-accent">0%</span>
                </div>
                <div class="progress-bar-container h-1.5 bg-black rounded overflow-hidden">
                    <div
                        class="progress-bar-fill bg-primary h-full w-0 transition-all duration-300 shadow-[0_0_8px_var(--color-primary)]">
                    </div>
                </div>
            </div>
        </div>

        <div
            class="detected-items-list flex-auto overflow-y-auto p-sm space-y-xs min-h-0 bg-secondary/30 mt-sm rounded border border-white/5 custom-scrollbar">
            <div class="flex-center flex-col gap-sm h-full text-muted italic status-placeholder py-xl">
                <span class="text-sm">Adjust sensitivity and click Detect</span>
            </div>
        </div>
    </div>
</template>
