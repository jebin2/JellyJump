# Keeps dependencies and the pinned GitHub Actions current. Each update is a
# pull request, tested like any other before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # TypeScript 7 is the native rewrite: it reads JSDoc types differently
      # (`Object` becomes `object`) and fails the type check across the app.
      # Moving to it is a piece of work of its own, not a weekly bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
