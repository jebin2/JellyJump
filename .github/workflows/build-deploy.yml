name: Build and Deploy

# A merge to main deploys only once the Test workflow has passed on that same
# commit. Deploying on the push itself published commits whose tests then
# failed: the two workflows ran side by side and nothing connected them.
# Pull requests still run the build here, as a check that the site builds.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # After Test on main: only when it passed, and only for a push (Test also
    # runs for pull requests, whose completion must not deploy anything).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    env:
      # The commit to build: the one Test passed on, or the event's own.
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Deploy after Test passed on main, or on a manual run on main -- and
      # only the newest commit there. Two merges close together finish their
      # tests in either order, and an older build must not replace a newer one
      # on the live site.
      - name: Decide whether to deploy
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          deploy=false
          if [ "$EVENT" = "workflow_run" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" = "refs/heads/main" ]; }; then
            deploy=true
            git fetch origin main
            tip=$(git rev-parse origin/main)
            if [ "$tip" != "$BUILD_SHA" ]; then
              echo "main is now at $tip, newer than $BUILD_SHA; its own run will deploy."
              deploy=false
            fi
          fi
          echo "Deploy: $deploy"
          echo "DEPLOY=$deploy" >> "$GITHUB_ENV"

      # The same Node the tests ran on, so what is deployed is what was tested.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci
      - name: Build with Vite
        run: npm run build

      - name: Deploy to release branch
        # A pull request against main triggers this workflow too, and without
        # this guard the step pushed the PR's build to `release` -- which is
        # the branch Pages serves, so proposing a change published it to the
        # live site. DEPLOY is true only after Test passed on main (or a manual
        # run on main), and only for the newest commit there.
        #
        # The site, plus the files the desktop build script fetches from this
        # branch. Pull request previews under previews/ are kept: the script
        # commits on top of the branch and never force-pushes.
        if: env.DEPLOY == 'true'
        run: |
          site=$(mktemp -d)
          cp -r dist/. "$site"/
          cp -r desktop build-desktop.sh package-lock.json package.json "$site"/
          bash scripts/ci/publish-pages.sh site "$site"

      # Pushing to `release` is not the deploy. GitHub Pages then builds that
      # branch itself, as a separate job with its own outcome -- and that
      # build can fail while this workflow still reports success. It has: a
      # green run published nothing, and the symptom was indistinguishable
      # from slow CDN propagation. Without this step there is no signal at all.
      # Previews push to the same branch, so a build of a later commit that
      # contains this one counts too.
      - name: Verify GitHub Pages published
        if: env.DEPLOY == 'true' && env.PUBLISHED_SHA != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          deadline=$(( SECONDS + 600 ))
          while (( SECONDS < deadline )); do
            if ! json=$(gh api "repos/${{ github.repository }}/pages/builds/latest" 2>/dev/null); then
              echo "Pages API not answering yet; retrying."
              sleep 15
              continue
            fi
            status=$(jq -r '.status' <<< "$json")
            commit=$(jq -r '.commit' <<< "$json")
            git fetch --quiet origin release
            if [ "$commit" != "$PUBLISHED_SHA" ] && ! git merge-base --is-ancestor "$PUBLISHED_SHA" "$commit" 2>/dev/null; then
              echo "Waiting for a Pages build that includes $PUBLISHED_SHA (newest is $commit, $status)."
            elif [ "$status" = "built" ]; then
              echo "Pages published $commit."
              exit 0
            elif [ "$status" = "errored" ]; then
              echo "::error::GitHub Pages build failed: $(jq -r '.error.message // "no message given"' <<< "$json")"
              exit 1
            else
              echo "Pages build is $status."
            fi
            sleep 15
          done
          echo "::error::Timed out after 10 minutes waiting for the GitHub Pages build."
          exit 1

      # Published is not the same as working (plan S7): wait until the live
      # site serves this build, then open it, load the sample, seek, and
      # fail loudly on any error. Blocks the visit counter.
      - name: Check the live site
        if: env.DEPLOY == 'true' && env.PUBLISHED_SHA != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx playwright-core install --with-deps chromium
          export CHROMIUM_PATH=$(node --input-type=module -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath())")
          url=$(gh api "repos/${{ github.repository }}/pages" --jq '.html_url')
          node scripts/live-smoke-test.mjs "$url" "$BUILD_SHA"
