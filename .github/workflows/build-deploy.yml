name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build with Vite
        run: npm run build

      - name: Deploy to release branch
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Move build directory contents and other files to temp location
          TEMP_DIR=/tmp/release-artifacts
          mkdir -p "$TEMP_DIR"

          # Move contents of dist to root of temp dir (Flattens the structure)
          cp -r dist/* "$TEMP_DIR/" 2>/dev/null || true

          # Copy other necessary files
          cp -r desktop "$TEMP_DIR/" 2>/dev/null || true
          cp build-desktop.sh "$TEMP_DIR/" 2>/dev/null || true
          cp package-lock.json "$TEMP_DIR/" 2>/dev/null || true
          cp package.json "$TEMP_DIR/" 2>/dev/null || true
          
          # Create or checkout release branch
          git fetch origin
          git checkout release 2>/dev/null || git checkout --orphan release
          
          # Clear everything in release branch
          git rm -rf . 2>/dev/null || true
          rm -rf * 2>/dev/null || true
          
          # Move selected files/folders back
          mv "$TEMP_DIR"/* . 2>/dev/null || true
          
          # Force add all files
          git add -A
          
          # Commit if there are changes
          if ! git diff --staged --quiet 2>/dev/null; then
            git commit -m "Build: Update release artifacts from main [skip ci]"
          fi
          
          # Push to release branch
          git push -f origin release