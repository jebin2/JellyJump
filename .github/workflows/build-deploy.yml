name: Build and Deploy

# A merge to main deploys only once the Test workflow has passed on that same
# commit. Deploying on the push itself published commits whose tests then
# failed: the two workflows ran side by side and nothing connected them.
# Pull requests still run the build here, as a check that the site builds.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # After Test on main: only when it passed, and only for a push (Test also
    # runs for pull requests, whose completion must not deploy anything).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    env:
      # The commit to build: the one Test passed on, or the event's own.
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Deploy after Test passed on main, or on a manual run on main -- and
      # only the newest commit there. Two merges close together finish their
      # tests in either order, and an older build must not replace a newer one
      # on the live site.
      - name: Decide whether to deploy
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          deploy=false
          if [ "$EVENT" = "workflow_run" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" = "refs/heads/main" ]; }; then
            deploy=true
            git fetch origin main
            tip=$(git rev-parse origin/main)
            if [ "$tip" != "$BUILD_SHA" ]; then
              echo "main is now at $tip, newer than $BUILD_SHA; its own run will deploy."
              deploy=false
            fi
          fi
          echo "Deploy: $deploy"
          echo "DEPLOY=$deploy" >> "$GITHUB_ENV"

      # The same Node the tests ran on, so what is deployed is what was tested.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci
      - name: Build with Vite
        run: npm run build

      - name: Note the current Pages build
        if: env.DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.created_at' 2>/dev/null || echo none)
          echo "PAGES_BUILD_BEFORE=$before" >> "$GITHUB_ENV"
          echo "Pages build current before this deploy: $before"

      - name: Deploy to release branch
        # A pull request against main triggers this workflow too, and without
        # this guard the step force-pushed the PR's build to `release` -- which
        # is the branch Pages serves, so proposing a change published it to the
        # live site. DEPLOY is true only after Test passed on main (or a manual
        # run on main), and only for the newest commit there.
        if: env.DEPLOY == 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Move build directory contents and other files to temp location
          TEMP_DIR=/tmp/release-artifacts
          mkdir -p "$TEMP_DIR"

          # Move contents of dist to root of temp dir (Flattens the structure)
          cp -r dist/* "$TEMP_DIR/" 2>/dev/null || true

          # Copy other necessary files
          cp -r desktop "$TEMP_DIR/" 2>/dev/null || true
          cp build-desktop.sh "$TEMP_DIR/" 2>/dev/null || true
          cp package-lock.json "$TEMP_DIR/" 2>/dev/null || true
          cp package.json "$TEMP_DIR/" 2>/dev/null || true
          
          # Create or checkout release branch
          git fetch origin
          git checkout release 2>/dev/null || git checkout --orphan release
          
          # Clear everything in release branch
          git rm -rf . 2>/dev/null || true
          rm -rf * 2>/dev/null || true
          
          # Move selected files/folders back
          mv "$TEMP_DIR"/* . 2>/dev/null || true
          
          # Force add all files
          git add -A
          
          # Commit if there are changes
          if ! git diff --staged --quiet 2>/dev/null; then
            git commit -m "Build: Update release artifacts from main [skip ci]"
            echo "PAGES_EXPECT_BUILD=yes" >> "$GITHUB_ENV"
          else
            echo "Nothing changed; Pages will not rebuild."
            echo "PAGES_EXPECT_BUILD=no" >> "$GITHUB_ENV"
          fi
          
          # Push to release branch
          git push -f origin release

      # Pushing to `release` is not the deploy. GitHub Pages then builds that
      # branch itself, as a separate job with its own outcome -- and that
      # build can fail while this workflow still reports success. It has: a
      # green run published nothing, and the symptom was indistinguishable
      # from slow CDN propagation. Without this step there is no signal at all.
      - name: Verify GitHub Pages published
        if: env.DEPLOY == 'true' && env.PAGES_EXPECT_BUILD == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          deadline=$(( SECONDS + 600 ))
          while (( SECONDS < deadline )); do
            if ! json=$(gh api "repos/${{ github.repository }}/pages/builds/latest" 2>/dev/null); then
              echo "Pages API not answering yet; retrying."
              sleep 15
              continue
            fi
            status=$(jq -r '.status' <<< "$json")
            created=$(jq -r '.created_at' <<< "$json")

            # A build that predates this deploy says nothing about it.
            if [ "$created" = "$PAGES_BUILD_BEFORE" ]; then
              echo "Waiting for a new Pages build to start (newest is still $created)."
            elif [ "$status" = "built" ]; then
              echo "Pages published commit $(jq -r '.commit' <<< "$json")."
              exit 0
            elif [ "$status" = "errored" ]; then
              echo "::error::GitHub Pages build failed: $(jq -r '.error.message // "no message given"' <<< "$json")"
              exit 1
            else
              echo "Pages build is $status."
            fi
            sleep 15
          done
          echo "::error::Timed out after 10 minutes waiting for the GitHub Pages build."
          exit 1
