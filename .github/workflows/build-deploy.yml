name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build with Vite
        run: npm run build

      - name: Note the current Pages build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.created_at' 2>/dev/null || echo none)
          echo "PAGES_BUILD_BEFORE=$before" >> "$GITHUB_ENV"
          echo "Pages build current before this deploy: $before"

      - name: Deploy to release branch
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Move build directory contents and other files to temp location
          TEMP_DIR=/tmp/release-artifacts
          mkdir -p "$TEMP_DIR"

          # Move contents of dist to root of temp dir (Flattens the structure)
          cp -r dist/* "$TEMP_DIR/" 2>/dev/null || true

          # Copy other necessary files
          cp -r desktop "$TEMP_DIR/" 2>/dev/null || true
          cp build-desktop.sh "$TEMP_DIR/" 2>/dev/null || true
          cp package-lock.json "$TEMP_DIR/" 2>/dev/null || true
          cp package.json "$TEMP_DIR/" 2>/dev/null || true
          
          # Create or checkout release branch
          git fetch origin
          git checkout release 2>/dev/null || git checkout --orphan release
          
          # Clear everything in release branch
          git rm -rf . 2>/dev/null || true
          rm -rf * 2>/dev/null || true
          
          # Move selected files/folders back
          mv "$TEMP_DIR"/* . 2>/dev/null || true
          
          # Force add all files
          git add -A
          
          # Commit if there are changes
          if ! git diff --staged --quiet 2>/dev/null; then
            git commit -m "Build: Update release artifacts from main [skip ci]"
            echo "PAGES_EXPECT_BUILD=yes" >> "$GITHUB_ENV"
          else
            echo "Nothing changed; Pages will not rebuild."
            echo "PAGES_EXPECT_BUILD=no" >> "$GITHUB_ENV"
          fi
          
          # Push to release branch
          git push -f origin release

      # Pushing to `release` is not the deploy. GitHub Pages then builds that
      # branch itself, as a separate job with its own outcome -- and that
      # build can fail while this workflow still reports success. It has: a
      # green run published nothing, and the symptom was indistinguishable
      # from slow CDN propagation. Without this step there is no signal at all.
      - name: Verify GitHub Pages published
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PAGES_EXPECT_BUILD == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          deadline=$(( SECONDS + 600 ))
          while (( SECONDS < deadline )); do
            if ! json=$(gh api "repos/${{ github.repository }}/pages/builds/latest" 2>/dev/null); then
              echo "Pages API not answering yet; retrying."
              sleep 15
              continue
            fi
            status=$(jq -r '.status' <<< "$json")
            created=$(jq -r '.created_at' <<< "$json")

            # A build that predates this deploy says nothing about it.
            if [ "$created" = "$PAGES_BUILD_BEFORE" ]; then
              echo "Waiting for a new Pages build to start (newest is still $created)."
            elif [ "$status" = "built" ]; then
              echo "Pages published commit $(jq -r '.commit' <<< "$json")."
              exit 0
            elif [ "$status" = "errored" ]; then
              echo "::error::GitHub Pages build failed: $(jq -r '.error.message // "no message given"' <<< "$json")"
              exit 1
            else
              echo "Pages build is $status."
            fi
            sleep 15
          done
          echo "::error::Timed out after 10 minutes waiting for the GitHub Pages build."
          exit 1
