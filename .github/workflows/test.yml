name: Test

# The test suites used to run only by hand, so a change that broke one could
# merge as long as it built. This runs all of them on every pull request.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The suites use import.meta.dirname, which needs Node 20.11+;
      # 22 is what they are run with locally.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # Playwright's own Chromium, the browser the suites are run with
      # locally. Left to themselves they take the first browser on the
      # runner, and the one they found there could neither decode nor encode
      # H.264, which the HLS, live and encryption suites need.
      - name: Install Chromium
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node --input-type=module -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath())")" >> "$GITHUB_ENV"

      # Quality check, library hashes, build, then every suite. The one
      # needing Electron is skipped, as the desktop app's own dependencies
      # are not installed here.
      - name: Run tests
        run: npm test
