name: Test

# The test suites used to run only by hand, so a change that broke one could
# merge as long as it built. This runs all of them on every pull request.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  # The desktop release runs this first (desktop-release.yml).
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The suites use import.meta.dirname, which needs Node 20.11+;
      # 22 is what they are run with locally.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        env:
          # onnxruntime-node (pulled in by @huggingface/transformers) downloads
          # native binaries on install. Nothing here uses them -- subtitles run
          # in the browser on onnxruntime-web -- and the download timing out
          # failed whole runs (#98, #100).
          ONNXRUNTIME_NODE_INSTALL: skip

      # What ships, and what the desktop app installs, may not carry a known
      # high or critical vulnerability. Dev tools are left out: they run on
      # the build machine, not in anything a user gets. The desktop audit
      # reads its lockfile; nothing needs installing for it.
      - name: Audit dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          (cd desktop && npm audit --omit=dev --audit-level=high)
      # Playwright's own Chromium, the browser the suites are run with
      # locally. Left to themselves they take the first browser on the
      # runner, and the one they found there could neither decode nor encode
      # H.264, which the HLS, live and encryption suites need.
      - name: Install Chromium
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node --input-type=module -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath())")" >> "$GITHUB_ENV"

      # Quality check, library hashes, build, then every suite. The one
      # needing Electron is skipped, as the desktop app's own dependencies
      # are not installed here.
      - name: Run tests
        run: npm test
