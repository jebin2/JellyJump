name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Every suite, as on a pull request, before anything is built. A tag can
  # point at any commit, not only one whose pull request passed (plan S4).
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build:
    name: Build ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      # The tag is the source of truth for the version (BUG-11): stamped into
      # both package.json files and given to the web build, so the app, its
      # Diagnostics and the installer all say the release's number.
      - name: Stamp Version From Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VITE_APP_VERSION=$version" >> "$GITHUB_ENV"
          npm version --no-git-tag-version --allow-same-version "$version"
          (cd desktop && npm version --no-git-tag-version --allow-same-version "$version")
        shell: bash

      - name: Install Web Dependencies
        run: npm ci
      - name: Build Web App
        run: npm run build

      - name: Prepare Desktop Build
        run: |
          mkdir -p desktop/build
          cp -r dist/* desktop/build/
        shell: bash

      - name: Install Desktop Dependencies
        working-directory: ./desktop
        run: npm ci
      # The app, launched. Every release until now shipped a build nobody had
      # started: the web suites cover the same code behind http(s), and the
      # ways the desktop differs -- file://, no node in the renderer, a preload
      # bridge -- are exactly the ways it can be broken while every other test
      # passes. Linux only, because one runner proving the app comes up is the
      # point; xvfb because Electron segfaults under a debugger with the
      # headless ozone backend.
      - name: Launch The App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a node scripts/desktop-smoke-test.mjs

      - name: Build Desktop App (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --linux --publish never

      - name: Build Desktop App (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --win --publish never

      - name: Build Desktop App (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: ./desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist -- --mac --publish never

      - name: Upload Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-artifacts
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: warn

      - name: Upload Windows Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-artifacts
          path: |
            desktop/dist/*.exe
          if-no-files-found: warn

      - name: Upload macOS Artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-artifacts
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    # A manual run builds the installers to try; only a tag publishes them.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # One file listing every installer's SHA-256, so a download can be
      # checked: sha256sum -c SHA256SUMS.txt --ignore-missing
      - name: Checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release
          cat release/SHA256SUMS.txt

      # The release page says what changed: the version's CHANGELOG.md
      # section, or the commit subjects since the last tag if it has none.
      - name: Release Notes
        run: |
          node scripts/release.mjs notes "$GITHUB_REF_NAME" > notes.md
          printf '\n---\nVerify a download: `sha256sum -c SHA256SUMS.txt --ignore-missing`\n' >> notes.md
          cat notes.md

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          draft: true
          body_path: notes.md
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
